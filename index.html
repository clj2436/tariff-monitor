<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营商资费监控 · 数据一览</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --card2:#fafbfc; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --border2:#f0f1f4; --shadow:0 2px 10px rgba(16,24,40,.05);
  --blue:#2563eb; --blue-soft:#eff6ff; --up:#e11d2a; --down:#0f9d6e; --warn:#b45309;
  --mobile:#0f9d6e; --unicom:#e11d2a; --telecom:#2f6fdb; --gb:#7c3aed;
}
body.dark{
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --text:#e5e7eb; --muted:#94a3b8;
  --border:#334155; --border2:#2a3648; --shadow:0 2px 12px rgba(0,0,0,.25);
  --blue:#60a5fa; --blue-soft:#1e3a5f; --warn:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1320px;margin:0 auto;padding:22px 28px 40px}
button,select,input{font-family:inherit}
button{cursor:pointer}

/* 顶部 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#1e7fef,#0f9d6e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(31,127,239,.25);flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700}
.brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.tag-demo{font-size:11.5px;color:var(--warn);background:transparent;border:1px dashed var(--warn);padding:5px 9px;border-radius:7px;white-space:nowrap}
.sync{color:var(--muted);font-size:11.5px;white-space:nowrap}

/* 导航 */
.mainnav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.nav-btn{border:0;background:transparent;color:var(--muted);padding:11px 17px;font-size:13.5px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav-btn:hover{color:var(--text)}
.nav-btn.on{color:var(--blue);border-bottom-color:var(--blue)}

/* 通用卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.card-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--blue-soft);color:var(--blue)}
.section{margin-bottom:16px}

/* 总览 */
.hero{background:linear-gradient(120deg,#1e7fef,#0f9d6e);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{margin:0;font-size:20px;font-weight:750}
.hero p{margin:6px 0 0;font-size:12.5px;opacity:.88}
.hero-stats{display:flex;gap:34px;margin-top:18px;flex-wrap:wrap;position:relative}
.hero-stats b{display:block;font-size:23px;font-weight:750;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.84}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--blue))}
.kpi-label{color:var(--muted);font-size:12px}
.kpi-val{font-size:26px;font-weight:750;margin:6px 0 2px;line-height:1.1;letter-spacing:-.4px}
.kpi-foot{color:var(--muted);font-size:11px}
.kpi-action{margin-top:10px}
.kpi-action .btn{font-size:11.5px;padding:5px 9px}
.overview-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.dist{padding:16px 18px}
.dist-row{display:grid;grid-template-columns:82px 1fr 44px;align-items:center;gap:10px;margin-bottom:13px}
.dist-row:last-child{margin-bottom:0}
.dist-name{font-size:12px;font-weight:600;color:var(--muted)}
.dist-track{height:9px;background:var(--border2);border-radius:99px;overflow:hidden}
.dist-fill{height:100%;border-radius:99px;background:var(--blue)}
.dist-val{text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.prov-list{padding:8px 18px 14px}
/* 省份统计：全部省份单列竖排 */
.prov-list.all{padding:8px 18px 14px}
.prov-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.prov-item:last-child{border-bottom:0}
.prov-item b{font-variant-numeric:tabular-nums}
.prov-more{text-align:center;color:var(--blue);font-size:12px;padding:10px;cursor:pointer;font-weight:600}
.prov-pick{cursor:pointer;border-radius:5px;padding-left:6px;padding-right:6px;transition:.15s}
.prov-pick:hover{background:var(--blue-soft);color:var(--blue)}
.prov-pick.on{color:var(--blue);font-weight:700}

/* 筛选栏 */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);margin-bottom:14px}
select,input[type=text]{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12.5px;outline:none}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.search{position:relative;display:flex;align-items:center}
.search input{padding-left:29px;width:200px}
.search::before{content:"⌕";position:absolute;left:10px;color:var(--muted);font-size:16px;pointer-events:none}
.btn-prov{display:flex;align-items:center;gap:6px}
.sep{width:1px;height:22px;background:var(--border)}
.filter-info{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px}
.link-btn{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:600;padding:4px}

/* 表格 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border2);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--card2)}
.op-badge{display:inline-flex;align-items:center;gap:5px;background:var(--card2);color:var(--oc);padding:3px 8px;border-radius:5px;font-size:11.5px;font-weight:700;white-space:nowrap}
.op-badge i{width:6px;height:6px;border-radius:50%;background:var(--oc)}
.name{font-weight:650}
.namecode{font-weight:400;font-size:10.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}
.type-tag{color:var(--muted);background:var(--card2);padding:2px 7px;border-radius:5px;font-size:11px;white-space:nowrap}
.owner-tag{padding:2px 7px;border-radius:5px;font-size:11px;white-space:nowrap;font-weight:600}
.owner-tag.person{background:#ecfdf5;color:#047857}
.owner-tag.biz{background:#fff7ed;color:#c2410c}
.price{font-weight:750;font-size:13.5px;font-variant-numeric:tabular-nums}
.price.zero{color:var(--down)}
.muted{color:var(--muted)}
.chg{font-weight:700;font-size:11.5px;white-space:nowrap}
.chg.new{color:var(--blue)} .chg.off{color:var(--muted)} .chg.mod{color:var(--warn)}
.star{border:0;background:transparent;color:#cbd5e1;font-size:16px;padding:2px 5px}
.star.on{color:#f59e0b}
.detail{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:6px;padding:4px 9px;font-size:11.5px}
.detail:hover{color:var(--blue);border-color:var(--blue)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
/* 加载态 / 加载失败态 */
.load-state{padding:54px 22px;text-align:center}
.load-spinner{width:42px;height:42px;margin:0 auto 20px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:loadspin .8s linear infinite}
@keyframes loadspin{to{transform:rotate(360deg)}}
.load-title{font-size:17px;font-weight:700;margin-bottom:8px}
.load-desc{color:var(--muted);font-size:12.5px;line-height:1.9;max-width:520px;margin:0 auto}
.load-steps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;max-width:560px}
.load-step{font-size:11px;padding:5px 10px;border:1px solid var(--border);border-radius:20px;color:var(--muted);background:var(--card)}
.load-step.on{color:#0f9d6e;border-color:#0f9d6e}
.load-icon{font-size:34px;margin-bottom:14px}
.load-retry{margin-top:18px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 17px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);gap:12px;flex-wrap:wrap}
.pager-btns{display:flex;gap:6px}
.pager-btns button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;padding:5px 10px;font-size:12px}
.pager-btns button:disabled{opacity:.4;cursor:not-allowed}

/* 订阅推送配置 */
.sub-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.sub-wrap{grid-template-columns:1fr}}
.sub-sec{padding:16px 18px}
.sub-sec h4{margin:0 0 4px;font-size:13.5px;font-weight:700}
.sub-hint{font-size:11.5px;color:var(--muted);margin:0 0 14px;line-height:1.6}
.sub-op{margin-bottom:16px}
.sub-op-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sub-op-name{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}
.sub-op-dot{width:9px;height:9px;border-radius:50%;background:var(--oc,var(--blue))}
.sub-mini{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600}
.sub-mini:hover{color:var(--blue);border-color:var(--blue)}
.sub-chips{display:flex;flex-wrap:wrap;gap:6px}
.sub-chip{border:1px solid var(--border);background:var(--card2);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:11.5px;font-weight:600;transition:.12s}
.sub-chip:hover{border-color:var(--oc,var(--blue))}
.sub-chip.on{background:var(--oc,var(--blue));border-color:var(--oc,var(--blue));color:#fff}
.sub-field{margin-bottom:13px}
.sub-field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.sub-field input,.sub-field textarea{width:100%;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:7px;padding:8px 10px;font-size:12.5px;outline:none}
.sub-field input:focus,.sub-field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.sub-field textarea{resize:vertical;min-height:56px}
.sub-note{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.sub-note code{background:var(--card2);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-size:10.5px}
.sub-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sub-status{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.6;display:none;white-space:pre-line}
.sub-status.show{display:block}
.sub-status.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.sub-status.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.sub-status.info{background:var(--blue-soft);color:var(--blue);border:1px solid var(--border)}
body.dark .sub-status.ok{background:#14532d;color:#86efac;border-color:#166534}
body.dark .sub-status.err{background:#7f1d1d;color:#fca5a5;border-color:#991b1b}
.sub-summary{font-size:11.5px;color:var(--muted);padding:9px 11px;background:var(--card2);border:1px solid var(--border);border-radius:7px;margin-bottom:12px;line-height:1.7}
.sub-summary b{color:var(--text)}
.sub-warn{font-size:11px;color:var(--warn);margin-top:6px;line-height:1.6}

/* 时间线 */
.timeline{padding:8px 18px 16px;max-height:560px;overflow-y:auto}
.tl-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
.tl-item:last-child{border-bottom:0}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--oc);margin-top:5px;flex:none;box-shadow:0 0 0 4px var(--card2)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13px;font-weight:650}
.tl-meta{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tl-change{font-size:12px;margin-top:5px}
/* 变化历史：同一资费编号折叠为一组 */
.hist-group{border:1px solid var(--border);border-radius:9px;margin-bottom:9px;background:var(--card);overflow:hidden}
.hist-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;user-select:none;transition:.12s}
.hist-head:hover{background:var(--card2)}
.hist-arrow{color:var(--muted);font-size:11px;flex:none;transition:transform .15s}
.hist-group.open .hist-arrow{transform:rotate(90deg)}
.hist-main{flex:1;min-width:0}
.hist-name{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hist-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);background:var(--card2);border:1px solid var(--border);padding:1px 6px;border-radius:4px}
.hist-summary{color:var(--muted);font-size:11.5px;margin-top:3px}
.hist-count{font-size:11px;color:var(--blue);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:2px 9px;white-space:nowrap;flex:none}
.hist-body{display:none;border-top:1px dashed var(--border);padding:2px 14px 6px 30px;background:var(--card2)}
.hist-group.open .hist-body{display:block}
.hist-body .tl-item{padding:9px 0}
.batch-sum{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.batch-prov{font-size:10.5px;color:var(--muted);background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:1px 7px;white-space:nowrap}
.hist-body .tl-dot{box-shadow:none;width:8px;height:8px}

/* 关于 */
.about{padding:18px 20px;font-size:13px;color:var(--muted);line-height:1.9}
.about h3{color:var(--text);font-size:14px;margin:16px 0 6px}
.about h3:first-child{margin-top:0}
.about code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--blue)}
.about b{color:var(--text)}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
body.dark .notice{background:#422006;border-color:#78350f;color:#fcd34d}

/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.modal.hidden{display:none}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;width:min(560px,100%);max-height:82vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-box.wide{width:min(780px,100%)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:15.5px}
.close{border:0;background:var(--card2);color:var(--muted);width:28px;height:28px;border-radius:7px;font-size:18px;line-height:1}
.modal-body{padding:16px 20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);text-align:right}
.opt-list{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--card);text-align:left;color:var(--text)}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}
.opt-ico{width:34px;height:34px;border-radius:9px;background:var(--oc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px;flex:none}
.opt-main{flex:1}
.opt-name{font-weight:700;font-size:13.5px}
.opt-desc{color:var(--muted);font-size:11.5px;margin-top:2px}
.prov-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prov-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:9px 4px;font-size:12.5px}
.prov-btn:hover{border-color:var(--blue);color:var(--blue)}
.prov-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.result-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px;font-size:13px;line-height:2}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.detail-cell{background:var(--card);padding:11px 14px;min-height:60px}
.detail-cell span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.detail-cell b{font-size:12.5px;font-weight:650;word-break:break-word;line-height:1.45}
.detail-cell.full{grid-column:1/-1}
.detail-cell.full b{white-space:pre-wrap;font-weight:500;color:var(--text);font-size:12.5px}
.detail-sec{padding:16px 2px 8px;font-size:12.5px;font-weight:700;color:var(--text)}
.detail-note{padding:14px 18px;background:var(--card2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12.5px;line-height:1.95;white-space:pre-wrap}
.detail-note .para{padding:3px 0}
.detail-note .para+.para{border-top:1px dashed var(--border);margin-top:4px;padding-top:10px}
.detail-note .lead{font-weight:700;color:var(--blue)}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px;font-size:11px;color:var(--muted)}
.detail-meta .pill{font-size:10.5px}
.detail-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:10px}
.note-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-size:11px;color:var(--blue)}
/* 公示专区详情表 */
.pub-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:9px;overflow:hidden;font-size:12.5px;margin-bottom:4px}
.pub-table td{border:1px solid var(--border);padding:9px 13px;vertical-align:top}
.pub-table td.k{width:120px;background:var(--card2);color:var(--muted);font-weight:600;white-space:nowrap}
.pub-list{margin:0;padding:0;list-style:none}
.pub-list li{position:relative;padding:7px 0 7px 15px;line-height:1.75;border-bottom:1px dashed var(--border);word-break:break-word}
.pub-list li:last-child{border-bottom:0}
.pub-list li::before{content:"";position:absolute;left:2px;top:15px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.pub-list li b{color:var(--blue);font-weight:700}
.pub-group-title{font-size:12px;font-weight:700;color:var(--text);padding:14px 2px 7px;display:flex;align-items:center;gap:7px}
.pub-group-title::before{content:"";width:3px;height:13px;background:var(--blue);border-radius:2px}
/* 高级检索 */
.adv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 18px}
.adv-field{display:flex;flex-direction:column;gap:5px}
.adv-field label{font-size:11.5px;color:var(--muted);font-weight:600}
.adv-field input,.adv-field select{width:100%}
.adv-actions{display:flex;gap:8px;align-items:center;padding:0 18px 16px;flex-wrap:wrap}
.adv-actions .btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.adv-actions .btn-primary:hover{color:#fff;filter:brightness(1.06)}
.adv-hit{background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:1px 5px;font-weight:700}
.scope-hint{font-size:11.5px;color:var(--muted);padding:14px 18px 4px}
.scope-list{display:flex;flex-direction:column;gap:8px;padding:8px 18px 0}
.scope-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scope-tag{font-size:11.5px;color:var(--muted);font-weight:600;min-width:48px}
.scope-row select{min-width:128px}
.scope-dash{color:var(--muted);font-size:13px}
.scope-del{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 8px;border-radius:6px}
.scope-del:hover{color:var(--up);background:var(--card2)}
.scope-add{margin:12px 18px 0;align-self:flex-start}
@media(max-width:900px){.adv-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
body.dark .toast{background:#f1f5f9;color:#0f172a}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:24px;line-height:1.8}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.overview-grid{grid-template-columns:1fr}.app{padding:14px}.prov-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr 1fr}.search input{width:140px}.filter-info{margin-left:0}.prov-grid{grid-template-columns:repeat(2,1fr)}}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">⌁</div>
      <div><h1>运营商资费监控</h1><div class="sub">全网 · 各省资费数据一览</div></div>
    </div>
    <div class="tools">
      <span class="tag-demo" id="dataTag">加载中…</span>
      <span class="sync" id="sync">--</span>
      <button class="btn" id="offlineBtn" title="显示/隐藏已过下架日期的资费（默认隐藏）">已下线：隐藏</button>
      <button class="btn" id="reloadBtn" title="清除本地缓存并重新拉取全部数据">↻ 刷新数据</button>
      <button class="btn" id="checkBtn">检测资费</button>
      <button class="btn" id="switchBtn">移动 · 江西 ▾</button>
      <button class="btn" id="themeBtn">深色</button>
    </div>
  </header>

  <nav class="mainnav" id="nav"></nav>
  <div class="notice" id="notice">正在加载资费数据…实际资费以运营商官网与营业厅公示为准。</div>
  <main id="view"></main>

  <footer>运营商资费监控面板 · 数据仅供个人学习参考</footer>
</div>

<div class="modal hidden" id="carrierModal">
  <div class="modal-box wide">
    <div class="modal-head"><h3>切换运营商 / 省份</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="pub-group-title">选择运营商</div>
      <div class="opt-list" id="carrierOpts" style="margin-bottom:8px"></div>
      <div class="pub-group-title">选择省份</div>
      <div class="search" style="margin-bottom:10px"><input type="text" id="provSearch2" placeholder="搜索省份" style="width:100%"></div>
      <div class="prov-grid" id="provGrid2"></div>
      <div class="detail-actions"><button class="btn btn-primary" id="switchDone">完成</button></div>
    </div>
  </div>
</div>
<div class="modal hidden" id="provinceModal">
  <div class="modal-box">
    <div class="modal-head"><h3>选择省份</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="search" style="margin-bottom:14px"><input type="text" id="provSearch" placeholder="搜索省份" style="width:100%"></div>
      <div class="prov-grid" id="provGrid"></div>
    </div>
  </div>
</div>
<div class="modal hidden" id="checkModal">
  <div class="modal-box">
    <div class="modal-head"><h3>检测结果</h3><button class="close" data-close>×</button></div>
    <div class="modal-body"><div class="result-box" id="checkResult"></div></div>
    <div class="modal-foot"><button class="btn" data-close>知道了</button></div>
  </div>
</div>
<div class="modal hidden" id="detailModal">
  <div class="modal-box wide">
    <div class="modal-head"><h3 id="dTitle">资费详情</h3><button class="close" data-close>×</button></div>
    <div class="modal-body">
      <div class="detail-meta" id="dMeta"></div>
      <div id="dPublic"></div>
      <div class="detail-actions">
        <button class="btn" id="dCopy">复制详情</button>
        <button class="btn" id="dFav">☆ 收藏</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 基础配置 ---------- */
const CARRIERS = {
  mobile:{name:'中国移动',short:'移动',color:'#0f9d6e',desc:'官网&监控'},
  unicom:{name:'中国联通',short:'联通',color:'#e11d2a',desc:'官网&监控'},
  telecom:{name:'中国电信',short:'电信',color:'#2f6fdb',desc:'官网&监控'},
  gb:{name:'中国广电',short:'广电',color:'#7c3aed',desc:'官网&监控'}
};
const PROVINCES=['全国','北京','天津','河北','山西','内蒙古','辽宁','吉林','黑龙江','上海','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','重庆','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆'];
const TYPES=['套餐','加装包','营销活动'];
// 订阅规则仅存本机勾选，Token 永不落盘。结构 {mobile:['江西'], telecom:['新疆'], ...}
function loadSubRules(){
  try{
    const r=JSON.parse(localStorage.getItem('tariff_sub_rules')||'null');
    if(r&&typeof r==='object') return r;
  }catch(e){}
  return {mobile:['江西'],telecom:['新疆'],unicom:[],gb:[]};
}
const OWNERS=['个人','政企'];
// 不内置任何示例数据：页面只展示 GitHub Actions 抓取的真实公示数据。
// 数据未就绪时由加载态占位，加载失败显示错误提示，绝不用虚构资费冒充。
let DATA=[], HISTORY=[];
let loadState='loading'; // loading | ready | error | empty

/* ---------- 状态 ---------- */
/* 记住选择：localStorage + URL 地址栏双保险。
 * 部分预览/沙箱环境刷新会清空 localStorage，但 URL 一定保留，故 hash 优先。 */
const SEL_KEY='tariff_selection_v1';
const VALID_TABS=['overview','national','province','search','history','subscribe','about'];
function selFromHash(){
  try{
    const m=new URLSearchParams(location.hash.replace(/^#/,''));
    return {op:m.get('op')||'',prov:m.get('prov')||'',tab:m.get('tab')||'',sc:m.get('sc')||'',so:m.get('so')||''};
  }catch(e){return {};}
}
function loadSel(){
  let s={};
  try{s=JSON.parse(localStorage.getItem(SEL_KEY)||'null')||{};}catch(e){}
  const h=selFromHash();
  const op=h.op||s.op, prov=h.prov||s.prov, tab=h.tab||s.tab, sc=(h.sc!==''?h.sc:s.sc), so=(h.so!==''?h.so:s.so);
  return {
    op: CARRIERS[op]?op:'mobile',
    prov: PROVINCES.indexOf(prov)>=0?prov:'江西',
    tab: VALID_TABS.indexOf(tab)>=0?tab:'overview',
    showCollect: sc==='1',
    showOffline: so==='1'   // 默认不显示已下线资费
  };
}
const _sel=loadSel();
function saveSel(){
  const sel={op:state.op,prov:state.prov,tab:state.tab,sc:state.showCollect?'1':'0',so:state.showOffline?'1':'0'};
  try{localStorage.setItem(SEL_KEY,JSON.stringify(sel));}catch(e){}
  try{history.replaceState(null,'',location.pathname+'#'+new URLSearchParams(sel).toString());}catch(e){}
}
const state={tab:_sel.tab,op:_sel.op,prov:_sel.prov,showCollect:_sel.showCollect,showOffline:_sel.showOffline,type:'all',owner:'all',sort:'price',asc:true,q:'',favOnly:false,zeroOnly:false,histMode:'item',histPage:1,histExpand:false,page:1,size:12,
  // scopes: [{op,prov},...] 自定义检索范围（满足任一即命中，AND 语义由「同一条内 op+prov」体现）
  search:{scopes:[{op:'all',prov:'all'}],field:'any',kw:'',mode:'contains'},
  sub:{rules:loadSubRules(),atMobiles:localStorage.getItem('tariff_at_mobiles')||'',maxItems:Number(localStorage.getItem('tariff_max_items')||30),token:''},
  favs:new Set(JSON.parse(localStorage.getItem('tariff_favs')||'[]')),dark:localStorage.getItem('tariff_dark')==='1'};
const $=id=>document.getElementById(id);
const money=n=>n===0?'0元':'¥'+n;
// 北京时间(UTC+8)当天日期 YYYY-MM-DD。已下线判定必须按北京时间，与国内"今天"一致，
// 不受访问者浏览器时区影响（海外/跨时区访问也不会误判）。
function TODAY(){
  const d=new Date(Date.now()+8*3600*1000);
  return d.toISOString().slice(0,10);
}
function changeText(h){
  if(h.kind==='新增') return '新上架 · '+money(h.price)+'/月';
  if(h.kind==='下架') return '已下架 · 原 '+money(h.price)+'/月';
  const o=h.old||{},keys=Object.keys(o);
  if(!keys.length) return '资费详情有调整，详见运营商官网。';
  const L={price:'月费',data:'通用流量',voice:'语音',broadband:'宽带',note:'资费说明',note_full:'完整说明',
    scope:'适用范围',region:'适用地区',channel:'销售渠道',onDate:'上架日期',offDate:'下架日期',
    validPeriod:'有效期',inNetReq:'在网要求',unsubscribe:'退订方式',responsibility:'违约责任',
    sms:'短信',orient:'定向流量',regionData:'省内流量',iptv:'IPTV',rights:'权益',
    service:'其他服务内容',extraFees:'额外费用',otherNotes:'其他说明'};
  const val=(obj,k)=>k.indexOf('details.')===0?(obj.details||{})[k.slice(8)]:obj[k];
  const short=v=>{const s=String(v==null?'':v).replace(/\s+/g,' ');return s.length<=44?s:s.slice(0,44)+'…';};
  // note/note_full 是其他详情字段的汇总文本，已有具体字段变化时不重复展示
  const specific=keys.some(k=>k.indexOf('details.')===0||['price','data','voice','broadband'].indexOf(k)>=0);
  const parts=[];
  keys.forEach(k=>{
    if((k==='note'||k==='note_full')&&specific) return;
    const a=o[k],b=val(h,k);
    if(a==null&&b==null) return;
    if(String(a==null?'':a)===String(b==null?'':b)) return;
    const label=L[k]||L[k.split('.').pop()]||k;
    const fmt=k==='price'?(v=>money(Number(v)||0)):(v=>short(v==null?'—':v));
    parts.push(label+' '+fmt(a)+' → '+fmt(b));
  });
  return parts.length?parts.join(' · '):'资费详情有调整，详见运营商官网。';
}

function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2000);}
function opBadge(op){return '<span class="op-badge" style="--oc:'+CARRIERS[op].color+'"><i></i>'+CARRIERS[op].name+'</span>';}
function applyTheme(){document.body.classList.toggle('dark',state.dark);$('themeBtn').textContent=state.dark?'浅色':'深色';}

/* ---------- 导航 ---------- */
const TABS=[['overview','数据总览'],['national','全国资费'],['province','省份资费'],['search','字段检索'],['history','变化历史'],['subscribe','订阅推送'],['about','关于本页']];
function renderNav(){$('nav').innerHTML=TABS.map(([k,l])=>'<button class="nav-btn'+(state.tab===k?' on':'')+'" data-tab="'+k+'">'+l+'</button>').join('');
  $('nav').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.page=1;saveSel();renderNav();render();}));}

/* ---------- 数据查询 ---------- */
function currentRows(){
  let rows=DATA.filter(d=>d.op===state.op);
  if(!state.showOffline) rows=rows.filter(d=>!d.offline);
  if(state.tab==='national') rows=rows.filter(d=>d.scope==='全国');
  if(state.tab==='province') rows=rows.filter(d=>d.scope==='省份'&&d.province===state.prov);
  if(state.type!=='all') rows=rows.filter(d=>d.type===state.type);
  if(state.owner!=='all') rows=rows.filter(d=>d.owner===state.owner);
  if(state.zeroOnly) rows=rows.filter(d=>d.price===0);
  if(state.favOnly) rows=rows.filter(d=>state.favs.has(d.id));
  const q=state.q.trim().toLowerCase();
  // 覆盖全部字段：adaptRemote 已预计算 _hay；缺索引时按需补一次
  if(q) rows=rows.filter(d=>{
    if(!d._hay){
      const e=d.extra||{};
      d._hay=[d.name,d.code,d.type,d.owner,d.source,CARRIERS[d.op].name,d.province,
        d.data,d.voice,d.broadband,d.price,d.note,d.date,
        ...Object.values(e)].join(' ').toLowerCase();
    }
    return d._hay.includes(q);
  });
  rows.sort((a,b)=>{
    if(state.sort==='price') return state.asc ? a.price-b.price : b.price-a.price;
    // 时间排序：上架 / 下架 / 收录（采集）时间。空日期一律沉底，不受升降序影响。
    const ka=sortDateVal(a,state.sort), kb=sortDateVal(b,state.sort);
    if(!ka||!kb){
      if(ka===kb) return 0;
      return ka ? -1 : 1;
    }
    const cmp=kb.localeCompare(ka);   // 默认最新在前
    return state.asc ? cmp : -cmp;
  });
  return rows;
}
// 取用于排序的规范日期 YYYY-MM-DD；取不到返回空串（沉底）。
// kind: onDate 上架时间 / offDate 下架时间 / collected 收录(采集)时间
function sortDateVal(d,kind){
  if(kind==='collected') return normDate(d.date);
  const e=d.extra||{};
  let raw='';
  if(kind==='onDate') raw=e.onDate||e.onlineDate||e.saleDate||e['上架日期']||'';
  else if(kind==='offDate') raw=e.offDate||e.offlineDate||e['下架日期']||'';
  return normDate(raw);
}
function normDate(raw){
  const s=String(raw==null?'':raw).trim();
  const m=s.match(/(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
  return m ? m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2) : '';
}
function onDateOf(d){
  const e=d.extra||{};
  return e.onDate||e.onlineDate||e.saleDate||'—';
}
function offDateOf(d){
  const e=d.extra||{};
  return e.offDate||e.offlineDate||'—';
}
function cardsHTML(rows){
  const total=Math.max(1,Math.ceil(rows.length/state.size));
  if(state.page>total) state.page=total;
  const pageRows=rows.slice((state.page-1)*state.size,state.page*state.size);
  if(!rows.length) return '<div class="empty">没有符合条件的资费，试试调整筛选条件。</div>';
  return '<div class="table-wrap"><table><thead><tr><th>运营商</th><th>业务名称</th><th>类型</th><th>归属</th><th>月费</th><th>流量/语音</th><th>宽带</th><th>适用地区</th><th>上线日期</th><th>下架日期</th>'+(state.showCollect?'<th>采集日期</th>':'')+'<th>收藏</th><th>详情</th></tr></thead><tbody>'+
    pageRows.map(d=>'<tr>'+
      '<td>'+opBadge(d.op)+'</td>'+
      '<td class="name">'+d.name+(d.offline?' <span class="pill" style="background:#fee2e2;color:#991b1b">已下线</span>':'')+(d.code?'<div class="namecode">'+escHtml(d.code)+'</div>':'')+'</td>'+
      '<td><span class="type-tag">'+d.type+'</span></td>'+
      '<td><span class="owner-tag '+(d.owner==='个人'?'person':'biz')+'">'+d.owner+'</span></td>'+
      '<td class="price'+(d.price===0?' zero':'')+'">'+money(d.price)+'</td>'+
      '<td class="muted">'+d.data+(d.voice!=='—'?' · '+d.voice:'')+'</td>'+
      '<td class="muted">'+d.broadband+'</td>'+
      '<td class="muted">'+(d.scope==='全国'?'全网':d.province)+'</td>'+
      '<td class="muted">'+onDateOf(d)+'</td>'+
      '<td class="muted">'+offDateOf(d)+'</td>'+
      (state.showCollect?'<td class="muted">'+d.date+'</td>':'')+
      '<td><button class="star'+(state.favs.has(d.id)?' on':'')+'" data-fav="'+d.id+'">'+(state.favs.has(d.id)?'★':'☆')+'</button></td>'+
      '<td><button class="detail" data-detail="'+d.id+'">查看</button></td>'+
    '</tr>').join('')+'</tbody></table></div>'+
    '<div class="pager"><span>共 '+rows.length+' 条 · 第 '+state.page+' / '+total+' 页</span><div class="pager-btns">'+
    '<button data-page="prev"'+(state.page<=1?' disabled':'')+'>上一页</button><button data-page="next"'+(state.page>=total?' disabled':'')+'>下一页</button></div></div>';
}
function bindTable(){
  document.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.fav;state.favs.has(id)?state.favs.delete(id):state.favs.add(id);
    localStorage.setItem('tariff_favs',JSON.stringify([...state.favs]));render();toast(state.favs.has(id)?'已收藏':'已取消收藏');
  }));
  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.detail)));
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{
    const t=Math.max(1,Math.ceil(currentRows().length/state.size));
    state.page=b.dataset.page==='prev'?Math.max(1,state.page-1):Math.min(t,state.page+1);render();
  }));
}
function filtersHTML(withProv){
  return '<div class="filters">'+
    (withProv?'<button class="btn btn-prov" id="openProv">省份：'+state.prov+' ▾</button>':'')+
    '<select id="fType"><option value="all">全部类型</option>'+TYPES.map(t=>'<option'+(state.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<select id="fOwner"><option value="all">全部归属</option>'+OWNERS.map(t=>'<option'+(state.owner===t?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    '<select id="fSort"><option value="price"'+(state.sort==='price'?' selected':'')+'>按价格</option><option value="onDate"'+(state.sort==='onDate'?' selected':'')+'>上架时间</option><option value="offDate"'+(state.sort==='offDate'?' selected':'')+'>下架时间</option><option value="collected"'+(state.sort==='collected'?' selected':'')+'>收录时间</option></select>'+
    '<button class="btn" id="fAsc">'+(state.asc?'升序 ↑':'降序 ↓')+'</button>'+
    '<div class="search"><input type="text" id="fQ" value="'+state.q.replace(/"/g,'&quot;')+'" placeholder="搜索名称/编号/说明" style="width:230px"></div>'+
    '<button class="btn'+(state.zeroOnly?' on':'')+'" id="fZero" title="只看 0 元业务">零元业务</button>'+
    '<button class="btn'+(state.favOnly?' on':'')+'" id="fFav">★ 收藏</button>'+
    '<button class="btn'+(state.showCollect?' on':'')+'" id="fCollect" title="显示/隐藏采集日期列">采集日期'+(state.showCollect?' ✓':'')+'</button>'+
    '<div class="filter-info"><span id="fCount">--</span><button class="link-btn" id="fCsv">导出 CSV</button><button class="link-btn" id="fReset">重置</button></div>'+
  '</div>';
}
function bindFilters(withProv){
  if(withProv){$('openProv').addEventListener('click',()=>openProvinceModal());}
  $('fType').addEventListener('change',e=>{state.type=e.target.value;state.page=1;render();});
  $('fOwner').addEventListener('change',e=>{state.owner=e.target.value;state.page=1;render();});
  $('fSort').addEventListener('change',e=>{state.sort=e.target.value;state.page=1;render();});
  $('fAsc').addEventListener('click',()=>{state.asc=!state.asc;state.page=1;render();});
  $('fQ').addEventListener('input',e=>{state.q=e.target.value;state.page=1;refreshResults();});
  $('fZero').addEventListener('click',()=>{state.zeroOnly=!state.zeroOnly;state.page=1;render();});
  $('fFav').addEventListener('click',()=>{state.favOnly=!state.favOnly;state.page=1;render();});

const SEARCH_FIELDS=[
  ['any','任意内容(全文)'],['name','业务名称'],['code','方案编号'],['type','资费类型'],
  ['scope','适用范围'],['region','通用地区'],['channel','销售渠道'],['onDate','上线日期'],
  ['offDate','下线日期'],['validPeriod','有效期限'],['inNetReq','在网要求'],
  ['unsubscribe','退订方式'],['responsibility','违约责任'],['service','其他服务内容'],
  ['data','国内通用流量'],['voice','国内通话'],['orient','定向流量'],['sms','短信'],
  ['broadband','宽带'],['rights','权益'],['extraFees','超出资费说明']
];
// 取单条资费某检索字段的文本
function searchFieldText(d,key){
  if(key==='any') return [d.name,d.code,d.type,d.owner,d.province,d.source,d.data,d.voice,d.broadband,d.note,
    ...Object.values(d.extra||{})].join(' ');
  if(['name','code','type','data','voice','broadband','province'].includes(key)) return d[key]||'';
  if(key==='price') return String(d.price);
  return fieldVal(d,key)||'';
}
// 判断一条资费是否命中自定义范围组合：同一组内 op+prov 为 AND；多组之间为 OR（满足任一即命中）
function inScopes(d,scopes){
  if(!scopes||!scopes.length) return true;
  return scopes.some(s=>{
    const opOk = !s.op || s.op==='all' || d.op===s.op;
    let pvOk = !s.prov || s.prov==='all';
    if(!pvOk){
      if(d.scope==='全国') pvOk = (s.prov==='全国');
      else pvOk = (d.province===s.prov || d.scope===s.prov);
    }
    return opOk&&pvOk;
  });
}
function opOptions(sel){
  return '<option value="all"'+(sel==='all'?' selected':'')+'>全部运营商</option>'+
    Object.keys(CARRIERS).map(k=>'<option value="'+k+'"'+(sel===k?' selected':'')+'>'+CARRIERS[k].name+'</option>').join('');
}
function provOptions(sel){
  return '<option value="all"'+(sel==='all'?' selected':'')+'>全部省份</option>'+
    PROVINCES.map(p=>'<option value="'+p+'"'+(sel===p?' selected':'')+'>'+p+'</option>').join('');
}
// 检索范围去重：仅「运营商 + 省份」完全相同才视为重复；
// 存在包含关系的范围（如 全部×四川 与 中国移动×四川、中国移动×全部 与 中国移动×四川）不算重复，允许共存。
function scopeSig(s){return (s&&s.op||'all')+'|'+(s&&s.prov||'all');}
function dupScopeAt(scopes,i){
  const sig=scopeSig(scopes[i]);
  return scopes.findIndex((s,j)=>j!==i&&scopeSig(s)===sig);
}
// 新增范围时自动挑一个尚未使用的默认值，避免「加不进去」的情况
function freshScope(scopes){
  const seen=new Set(scopes.map(scopeSig));
  const ops=['all',...Object.keys(CARRIERS)];
  const provs=['all',...PROVINCES];
  for(const p of provs) for(const o of ops){const c={op:o,prov:p};if(!seen.has(scopeSig(c))) return c;}
  return {op:'all',prov:'all'};
}

function toggleSub(op,pv){
  const arr=state.sub.rules[op]||(state.sub.rules[op]=[]);
  const i=arr.indexOf(pv);
  if(pv==='*'){state.sub.rules[op]=i>=0?[]:['*'];}
  else{
    if(arr.includes('*')) state.sub.rules[op]=[pv]; // 从"全部"切到单个
    else if(i>=0) arr.splice(i,1);
    else arr.push(pv);
    state.sub.rules[op]=arr;
  }
  localStorage.setItem('tariff_sub_rules',JSON.stringify(state.sub.rules));
}
function buildSubConfig(existing){
  const s=state.sub;
  const rules=Object.keys(CARRIERS).map(op=>({op,provinces:(s.rules[op]||[]).slice()})).filter(r=>r.provinces.length);
  const at=s.atMobiles.split(',').map(x=>x.trim()).filter(Boolean);
  // 保留仓库现有配置里的站点地址/note 等非本页管理的字段，避免同步时被清空。
  const siteUrl=existing&&existing.site_url!==undefined?existing.site_url:(state.sub.siteUrl||'');
  return {version:1,updated_at:new Date().toISOString().slice(0,19).replace('T',' '),rules,at_mobiles:at,max_items:s.maxItems,site_url:siteUrl};
}

async function syncSubConfig(){
  const s=state.sub, token=(s.token||'').trim();
  if(subCount()===0){subStatus('请先勾选至少一个关注的运营商/省份。','err');return;}
  if(!token){subStatus('请先填写 GitHub Personal Access Token（需本仓库 Contents 写权限）。','err');return;}
  const btn=$('subSync');btn.disabled=true;btn.textContent='同步中…';
  subStatus('正在读取现有配置…','info');
  try{
    const api='https://api.github.com/repos/'+SUB_REPO+'/contents/'+SUB_CONFIG_PATH;
    const headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    // 1) 先 GET 现有文件拿 sha（更新文件必须带 sha）
    let sha=null, existing=null;
    const cur=await fetch(api,{headers});
    if(cur.ok){const j=await cur.json();sha=j.sha;
      try{existing=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content),c=>c.charCodeAt(0))));}catch(e){}
    }
    else if(cur.status!==404){
      const j=await cur.json().catch(()=>({}));
      throw new Error('读取配置失败 HTTP '+cur.status+'：'+(j.message||'请检查 Token 权限'));
    }
    // 2) 上传新配置（内容 base64 编码），保留现有 site_url 等字段
    const cfg=buildSubConfig(existing);
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2)+'\n')));
    const payload={message:'chore: 更新钉钉订阅关注规则（网页配置）',content,
      branch:'main'};
    if(sha) payload.sha=sha;
    subStatus('正在写入仓库…','info');
    const put=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!put.ok){
      const j=await put.json().catch(()=>({}));
      throw new Error('写入失败 HTTP '+put.status+'：'+(j.message||'Token 可能缺少 Contents 写权限'));
    }
    s.token=''; // 同步成功后清空内存中的 Token
    if($('subToken')) $('subToken').value='';
    subStatus('✓ 已同步到仓库！配置已保存（@手机号 / 上限 / 站点）。重点组合由专项每 4 小时推送，其他省份由全量每日三次推送。\n当前记录 '+subCount()+' 项。','ok');
  }catch(e){
    subStatus('同步失败：'+e.message+'\n\n提示：请使用细粒度 Token 并授予本仓库 Contents 读写权限。','err');
  }finally{
    btn.disabled=false;btn.textContent='同步到 GitHub';
  }
}

let detailId=null;
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// 把长说明按中文序号 / 数字序号 / 分号拆成段落，便于逐条阅读
function splitNote(note){
  if(!note) return [];
  let parts=note.split(/(?=[（(][一二三四五六七八九十]{1,3}[）)])|(?=(?:^|[；;\s])\d+[\.、．])/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1) parts=note.split(/(?<=[；;])/).map(s=>s.trim()).filter(Boolean);
  return parts.length?parts:[note];
}
function decoratePara(p){
  const m=p.match(/^([（(]?[一二三四五六七八九十\d]+[）)]?\s*[^：:]{0,14}[：:])(.*)$/s);
  return m ? '<span class="lead">'+escHtml(m[1])+'</span>'+escHtml(m[2]) : escHtml(p);
}
// 取详情字段值：优先结构化 details，兼容旧字段别名
function fieldVal(d,key){
  const e=d.extra||{};
  const aliases={
    scope:['scope','useScope','适用范围'], region:['region','applicableArea','适用地区','通用地区'],
    channel:['channel','saleChnl','销售渠道'], onDate:['onDate','上线日期'], offDate:['offDate','下线日期'],
    validPeriod:['validPeriod','有效期限','有效期'], inNetReq:['inNetReq','在网要求'],
    unsubscribe:['unsubscribe','退订方式'], responsibility:['responsibility','违约责任'],
    sms:['sms','短信'], orient:['orient','orientTraffic','定向流量'], regionData:['regionData','省内流量'],
    iptv:['iptv','移动高清'], rights:['rights','权益'], service:['service','serviceContent','其他服务内容'],
    extraFees:['extraFees','超出资费说明'], otherNotes:['otherNotes','其他说明']
  };
  for(const a of (aliases[key]||[key])) if(e[a]) return e[a];
  return '';
}

function fallbackCopy(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择文本');}
  document.body.removeChild(ta);
}

// GitHub Actions 抓取产物发布在 raw.githubusercontent.com；本地可直接放 data/ 目录。
const DATA_BASE = (typeof window.TARIFF_DATA_BASE !== 'undefined')
  ? window.TARIFF_DATA_BASE
  : 'data/';

// 把构建器的统一结构转成页面渲染所需字段
function adaptRemote(raw){
  const out=[];
  (raw||[]).forEach((d,i)=>{
    const op = d.op && CARRIERS[d.op] ? d.op : 'mobile';
    const prov = d.province || '全国';
    const scope = prov==='全国' ? '全国' : '省份';
    const type = ['套餐','加装包','营销活动'].includes(d.type) ? d.type : '套餐';
    const owner = d.owner==='政企' ? '政企' : '个人';
    const price = (d.price===null||d.price===undefined||isNaN(Number(d.price))) ? 0 : Number(d.price);
    const date = (d.date||(window.__meta&&window.__meta.date)||'').slice(0,10);
    const extra = d.details || {};
    const note = d.note_full || d.note || '详见运营商官网资费专区。';
    const item = {
      id: d.id || ('r'+i),
      op, name: d.name || '未命名资费', price,
      type, owner, cat: type+'/'+owner,
      data: d.data || '—', voice: d.voice || '—', broadband: d.broadband || '—',
      note,
      code: d.code || '', source: d.source || (CARRIERS[op].name+'官网'),
      extra,
      scope, province: prov,
      date: /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '2026-01-01'
    };
    // 统一判定"已下线"：有合法下架日期且早于今天。所有运营商统一口径，
    // 用于列表/总览统计/字段检索的默认隐藏（联通等源会保留大量已过期的历史资费）。
    const offRaw=extra.offDate||extra.offlineDate||'';
    const off=/^\d{4}-\d{2}-\d{2}$/.test(String(offRaw))?String(offRaw).slice(0,10):'';
    item.offDate=off;
    item.offline=!!(off && off < TODAY());
    // 预计算全字段搜索串：一次性拼接，避免每次输入时对上千条逐条 Object.values
    item._hay=[item.name,item.code,item.type,item.owner,item.source,CARRIERS[op].name,prov,
      item.data,item.voice,item.broadband,item.price,item.note,item.date,
      ...Object.values(extra)].join(' ').toLowerCase();
    out.push(item);
  });
  return out;
}
function adaptHistory(raw){
  return (raw||[]).map((h,i)=>({
    op: h.op && CARRIERS[h.op] ? h.op : 'mobile',
    province: h.province || '全国',
    name: h.name || '资费业务',
    kind: ['新增','修改','下架'].includes(h.kind) ? h.kind : '修改',
    date: (h.date||'').slice(0,10) || '2026-01-01',
    price: Number(h.price)||0,
    data: h.data, voice: h.voice, broadband: h.broadband,
    code: h.code || '',
    details: h.details && typeof h.details === 'object' ? h.details : null,
    old: h.old && typeof h.old === 'object' ? h.old : null
  })).sort((a,b)=>b.date.localeCompare(a.date));
}
// 判断「是否同一资费」优先用编号；无编号才退回 运营商+名称（部分运营商不公示编号）
function histKey(h){
  if(h.code) return 'c:'+h.op+'|'+h.code;              // 有编号：编号即身份，改名也归同一资费
  return 'n:'+h.op+'|'+(h.province||'')+'|'+(h.name||''); // 无编号：退回 运营商+省份+名称
}

/* ---------- 数据加载：4 家独立分片 + 四川联通专项 + 本地缓存 + 增量校验 ----------
 * 每家运营商由独立 workflow 抓取，产物在 data/ops/<op>/{latest,items,history}.json。
 * 四川联通另有专项 workflow（data/ops/unicom-sichuan/），抓得更快、单独推送；
 * 网页并行读 5 个 latest.json（每个约 200B）：哪个源签名变了才拉那份 items/history，
 * 合并时同一资费按「运营商+编号+省份+名称」去重，专项源优先。任一路慢/失败都不影响其他源。
 */
// 缓存改用 IndexedDB：全量数据约 127MB，localStorage 仅 5~10MB，根本写不进去，
// 导致每次打开都要全量重下并长时间停在示例数据。IndexedDB 容量足、异步写不卡主线程。
const CACHE_DB='tariff_cache_db', CACHE_STORE='kv', CACHE_KEY='meta';
const CACHE_VER=7;            // 结构或逻辑变更时递增，自动作废旧缓存（v7 新增 4 个重点专项源）
const CACHE_TTL=12*3600*1000; // 12 小时
let _cacheDb=null;
const OPS=['mobile','telecom','unicom','gb','unicom-sichuan','mobile-focus','telecom-focus','unicom-focus','gb-focus'];
const FOCUS_OPS=['unicom-sichuan','mobile-focus','telecom-focus','unicom-focus','gb-focus']; // 专项源：与全量源重复时专项优先
function opName(op){
  if(op==='unicom-sichuan') return '四川联通专项';
  if(op.endsWith('-focus')){const base=op.slice(0,-6);return (CARRIERS[base]?CARRIERS[base].name:base)+'重点专项';}
  return CARRIERS[op]?CARRIERS[op].name:op;
}
let opState={};          // op -> {sig,meta,items,hist}  各家原始数据
let opTimer=null;
let failedOps=new Set(); // 探测/拉取失败的数据源，下一轮优先重试，避免永久卡旧缓存
let combinedMeta=null;
// 带超时的 fetch，避免网络异常时无限卡在"正在加载"
function fetchJSON(url,ms){
  return new Promise((resolve,reject)=>{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),ms);
    fetch(url,{cache:'no-store',signal:ctl.signal})
      .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(resolve).catch(reject).finally(()=>clearTimeout(timer));
  });
}
function opSig(meta){return String(meta&&meta.timestamp||'')+'|'+(meta&&meta.count||0);}
function openCacheDB(){
  if(_cacheDb) return Promise.resolve(_cacheDb);
  return new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.open(CACHE_DB,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(CACHE_STORE))db.createObjectStore(CACHE_STORE);};
      req.onsuccess=()=>{_cacheDb=req.result;resolve(_cacheDb);};
      req.onerror=()=>reject(req.error);
    }catch(e){reject(e);}
  });
}
// IndexedDB 读写用结构化克隆，无需 JSON.stringify 整份大对象
function idbGet(k){return openCacheDB().then(db=>new Promise((res,rej)=>{const r=db.transaction(CACHE_STORE,'readonly').objectStore(CACHE_STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
function idbSet(k,v){return openCacheDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction(CACHE_STORE,'readwrite');tx.objectStore(CACHE_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
async function readCache(){
  try{
    const c=await idbGet(CACHE_KEY);
    if(!c||c.v!==CACHE_VER||!c.ops||typeof c.ops!=='object') return null;
    if(!c.savedAt||Date.now()-c.savedAt>CACHE_TTL) return null;
    if(!OPS.every(op=>c.ops[op]&&Array.isArray(c.ops[op].items))) return null;
    return c.ops;
  }catch(e){return null;}
}
async function writeCache(){
  try{await idbSet(CACHE_KEY,{v:CACHE_VER,savedAt:Date.now(),ops:opState});}
  catch(e){} // 不支持/配额不足时跳过缓存，不影响功能
}
async function clearCache(){
  try{await idbSet(CACHE_KEY,null);}catch(e){}
  // 清掉旧版 localStorage key，彻底移除历史脏快照
  for(const k of ['tariff_cache','tariff_cache_v2','tariff_cache_v3','tariff_cache_v4']){
    try{localStorage.removeItem(k);}catch(e){}
  }
}
// 把 4 家 + 四川联通专项原始数据合并成页面渲染所需的 meta/items/hist
function combineOps(){
  const itemMap=new Map(),hist=[],seenHist=new Set();
  let changes=0,latestTs='',latestDate='';
  OPS.forEach(op=>{
    const s=opState[op];
    if(!s) return;
    (s.items||[]).forEach(d=>{
      const k='i:'+(d.op||op)+'|'+(d.code||'')+'|'+(d.province||'')+'|'+(d.name||'');
      const old=itemMap.get(k);
      // 重点专项源与全量源会抓到同一批资费：专项源优先（数据更聚焦/更新更稳），避免重复展示
      const isFocus=FOCUS_OPS.indexOf(op)>=0, oldIsFocus=old&&FOCUS_OPS.indexOf(old.src)>=0;
      if(!old||(isFocus&&!oldIsFocus)) itemMap.set(k,{d,src:op});
    });
    (s.hist||[]).forEach(h=>{
      // 用真实存在的字段去重：date + old(变更内容) 区分同一资费的多次改动。
      // 旧实现引用 timestamp/fields/change（history.json 里并不存在），导致同资费多次修改被压成一条。
      const k='h:'+(h.op||'')+'|'+(h.code||'')+'|'+(h.province||'')+'|'+(h.name||'')+'|'+
        (h.kind||'')+'|'+(h.date||'')+'|'+JSON.stringify(h.old||'');
      if(seenHist.has(k)) return;
      seenHist.add(k);hist.push(h);
    });
    const m=s.meta||{};
    changes+=Number(m.changes)||0;
    if((m.timestamp||'')>latestTs) latestTs=m.timestamp||'';
    if((m.date||'')>latestDate) latestDate=m.date||'';
  });
  const items=[...itemMap.values()].map(x=>x.d);
  const byOp={},byProv={};
  items.forEach(d=>{
    const k=d.op||'other';byOp[k]=(byOp[k]||0)+1;
    const pk=d.province||'全国';byProv[pk]=(byProv[pk]||0)+1;
  });
  const meta={timestamp:latestTs,date:latestDate,count:items.length,by_op:byOp,by_province:byProv,changes};
  return {meta,items,hist};
}
function applyData(label){
  const {meta,items,hist}=combineOps();
  window.__meta=meta; combinedMeta=meta;
  DATA=adaptRemote(items);
  HISTORY=adaptHistory(hist);
  loadState='ready'; // 已有真实数据，解除加载态
  const tag=$('dataTag');
  tag.textContent=label||'真实数据';
  if(label==='真实数据'||!label){tag.style.background='#dcfce7';tag.style.color='#166534';}
  else{tag.style.background='#fef3c7';tag.style.color='#92400e';}
  const updOps=OPS.filter(op=>opState[op]&&opState[op].meta&&opState[op].meta.timestamp)
    .map(op=>opName(op)+' '+(opState[op].meta.date||'')).join(' · ');
  $('notice').textContent='数据由 GitHub Actions 分运营商独立抓取生成（含江西/吉林/贵州/四川/山西/新疆重点专项）· '+updOps+' · 实际资费以运营商官网与营业厅公示为准。';
  $('sync').textContent=(label&&label!=='真实数据'?'实时 · ':'更新于 ')+(meta.date||'--');
  render();
}
// 并行探测各数据源 latest.json：返回有变化的源列表。
// force=true 时忽略缓存签名，把所有探测成功的源都当作需要重新核对（用于首次加载/强制刷新）。
// 探测失败的源记入 failedOps，由轮询持续重试，避免某次网络抖动导致永久停留在旧缓存。
async function probeOps(force){
  const metas=await Promise.all(OPS.map(async op=>{
    try{return await fetchJSON(DATA_BASE+'ops/'+op+'/latest.json',7000);}
    catch(e){return null;}
  }));
  const changed=[];
  const ok=new Set();
  OPS.forEach((op,i)=>{
    const m=metas[i];
    if(!m||typeof m.count!=='number'){ failedOps.add(op); return; }
    ok.add(op); failedOps.delete(op);
    const sig=opSig(m);
    if(force||!opState[op]||opState[op].sig!==sig) changed.push([op,m,sig]);
  });
  return changed;
}
// 拉取指定运营商的 items/history，更新 opState。
// onEach：每个源拉取成功即刻回调（逐源渲染，用户尽早看到数据，不必等全部 127MB 下完）。
async function refreshOps(list,onEach){
  if(!list.length) return 0;
  let n=0;
  await Promise.all(list.map(async([op,m,sig])=>{
    try{
      const [items,hist]=await Promise.all([
        fetchJSON(DATA_BASE+'ops/'+op+'/items.json',45000),
        fetchJSON(DATA_BASE+'ops/'+op+'/history.json',20000).catch(()=>[])
      ]);
      if(!Array.isArray(items)) return;
      opState[op]={sig,meta:m,items,hist:Array.isArray(hist)?hist:[]};
      n++;
      writeCache(); // 每成功一个源即落盘，避免中途失败丢掉已拉到的数据
      if(onEach){try{onEach(op);}catch(e){}} // 渲染失败不影响落盘与其他源
    }catch(e){}
  }));
  return n;
}
function allSigs(){return OPS.map(op=>op+(opState[op]?':'+opState[op].sig:'')).join('|');}
function startPolling(){
  if(opTimer) return;
  opTimer=setInterval(async()=>{
    try{
      const changed=await probeOps(false);
      // 之前失败的源即使签名相同也重新拉一次，确保从旧快照中恢复
      for(const op of failedOps){
        try{const m=await fetchJSON(DATA_BASE+'ops/'+op+'/latest.json',7000);}
        catch(e){continue;}
        if(m&&typeof m.count==='number'&&!changed.some(x=>x[0]===op)) changed.push([op,m,opSig(m)]);
      }
      if(changed.length){
        const n=await refreshOps(changed);
        if(n){writeCache();applyData('实时抓取中');}
      }
    }catch(e){}
  },30000); // 30 秒探测一次，各家 meta 仅几十字节
}
function showLoadError(){
  loadState='error';
  const tag=$('dataTag');tag.textContent='加载失败';tag.style.background='#fee2e2';tag.style.color='#991b1b';
  $('notice').textContent='资费数据暂时无法加载。本页只展示运营商官网公示的真实数据，未使用任何示例数据；请点「刷新数据」重试。';
  render();
}
async function loadData(){
  // 1) 读 IndexedDB 缓存（异步），命中即秒开。缓存带版本/过期/结构校验，脏快照不会命中。
  let cached=null;
  try{cached=await readCache();}catch(e){}
  if(cached){opState=cached;applyData('本地缓存');}
  else{
    // 无缓存：明确显示"正在加载"，避免用户误以为卡在示例数据
    const tag=$('dataTag');tag.textContent='正在加载…';tag.style.background='#fef3c7';tag.style.color='#92400e';
    $('notice').textContent='正在加载线上资费数据，首次加载约需十几秒，请稍候…';
  }
  // 2) 签名探测：只拉签名变化的源。无缓存时 opState 为空，探测会把所有源都列入 changed，
  //    因此自然实现"首次全量、之后增量"，无需 force 每次全量重下。
  let changed=[];
  try{changed=await probeOps(false);}catch(e){}
  // 之前失败的源即使签名相同也重试，避免一次网络抖动永久停留旧数据
  for(const op of failedOps){
    try{const m=await fetchJSON(DATA_BASE+'ops/'+op+'/latest.json',7000);}
    catch(e){continue;}
    if(m&&typeof m.count==='number'&&!changed.some(x=>x[0]===op)) changed.push([op,m,opSig(m)]);
  }
  if(changed.length){
    // 逐源即时渲染：每拉到一个源就刷新，用户尽早看到数据，不必等全部下完
    const label=cached?'更新中':'真实数据';
    const n=await refreshOps(changed,()=>applyData(label));
    if(n){writeCache();applyData(label);}
    else if(!cached){showLoadError();return;}
  }else if(!cached){
    showLoadError();return;
  }
  // 有缓存但本轮全部探测失败：保留缓存数据，但明确标注"离线快照"，不谎称最新
  if(cached&&!changed.length){
    const tag=$('dataTag');tag.textContent='离线缓存';tag.style.background='#fef3c7';tag.style.color='#92400e';
  }
  startPolling();
}

/* ---------- 启动 ---------- */
(async function init(){
  applyTheme();updateSwitchLabel();updateOfflineBtn();renderNav();render();
  saveSel(); // 首次进入即固化到地址栏，localStorage 被清时刷新仍可恢复
  await loadData();
})();
</script>
