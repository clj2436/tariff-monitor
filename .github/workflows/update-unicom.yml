name: 抓取联通资费

# 独立 workflow：只抓 联通 一家，与其他运营商完全隔离。
# 联通 32 板块单 job 需 ~100 分钟，90 分钟预算只够抓完前 16 省（北京→河南），
# 后 15 省（湖北/广东/四川/贵州等）永远被跳过。改为 2 分片并行：
# 每片 16 板块 ~50 分钟，各自写 raw 分片，merge job 合并后统一 diff/推送/提交。
on:
  schedule:
    - cron: '5 0,8,16 * * *'   # 北京时间 00:05 / 08:05 / 16:05
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

# 每家独立并发组：同一家多次运行排队，不同家并行互不阻塞
concurrency:
  group: tariff-unicom
  cancel-in-progress: false

jobs:
  # ── 分片抓取：2 个 job 各抓 16 板块，只写 raw 分片，不做 diff/提交 ──
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1]
    steps:
      - name: 检出仓库（最新 main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取分片 ${{ matrix.shard_index }}（16 板块 raw）
        env:
          SHARD_IDX: ${{ matrix.shard_index }}
          SHARD_TOTAL: 2
          FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '3' }}
          UNICOM_TIME_BUDGET: ${{ vars.UNICOM_TIME_BUDGET || '120' }}
          GLOBAL_TIME_BUDGET_MIN: ${{ vars.GLOBAL_TIME_BUDGET_MIN || '60' }}
        run: |
          mkdir -p /tmp/unicom-shards
          python3 scripts/build_data.py --carriers unicom \
            --raw-out /tmp/unicom-shards/shard-${{ matrix.shard_index }}.json

      - name: 上传分片 raw
        uses: actions/upload-artifact@v4
        with:
          name: unicom-shard-${{ matrix.shard_index }}
          path: /tmp/unicom-shards/shard-${{ matrix.shard_index }}.json
          retention-days: 1

  # ── 合并：读全部分片 raw → 统一 id/合并/diff → 校验/推送/提交 ──
  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库（最新 main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载全部分片 raw
        uses: actions/download-artifact@v4
        with:
          pattern: unicom-shard-*
          merge-multiple: true
          path: /tmp/unicom-shards

      - name: 合并分片并构建本家数据
        env:
          # 分片补齐的省份第一次进入全量源：数据落盘，但首轮新增不计变化，避免刷屏。
          # 这 15 省此前因单 job 预算耗尽从未抓到，属于「新纳入」而非真实新上架。
          BASELINE_PROVINCES: '湖北,湖南,广东,广西,海南,重庆,四川,贵州,云南,西藏,陕西,甘肃,青海,宁夏,新疆'
        run: |
          python3 scripts/build_data.py --carriers unicom \
            --merge-from /tmp/unicom-shards \
            --out data/ops/unicom \
            --baseline-if-empty \
            --baseline-provinces '湖北,湖南,广东,广西,海南,重庆,四川,贵州,云南,西藏,陕西,甘肃,青海,宁夏,新疆'

      - name: 校验本家数据
        run: |
          python3 - <<'PYCHECK'
          import json, sys
          op = 'unicom'
          try:
            meta = json.load(open('data/ops/%s/latest.json' % op, encoding='utf-8'))
            items = json.load(open('data/ops/%s/items.json' % op, encoding='utf-8'))
          except Exception as e:
            print('数据文件读取失败:', e); sys.exit(1)
          if not isinstance(items, list) or meta.get('count', -1) != len(items):
            print('数据不一致: meta.count=%s items=%s' % (meta.get('count'), len(items) if isinstance(items, list) else '?'))
            sys.exit(1)
          provs = sorted((meta.get('by_province') or {}).keys())
          print('联通 校验通过：%d 条，本轮 %d 条变更，板块 %d 个：%s' % (
            len(items), meta.get('changes', 0), len(provs), ','.join(provs)))
          if len(provs) < 30:
            print('警告：联通板块不足 30 个，可能仍有省份抓取失败')
          PYCHECK

      - name: 推送本家变化到钉钉
        continue-on-error: true     # 推送失败不阻断数据提交
        env:
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'dingtalk' }}
          WATCH_RULES: ${{ vars.WATCH_RULES || 'unicom:*' }}
          DINGTALK_WEBHOOK_OTHER: ${{ secrets.DINGTALK_WEBHOOK_OTHER }}
          DINGTALK_SECRET_OTHER: ${{ secrets.DINGTALK_SECRET_OTHER }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || '资费监控' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 scripts/notify_dingtalk.py \
            --force-rules 'unicom:*' \
            --exclude-rules 'unicom:四川|江西|吉林|贵州|山西' \
            --input data/ops/unicom/current_changes.json \
            --state data/ops/unicom/.notify_state.json \
            --bot other \

            --tag '其他·联通'

      - name: 提交本家数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ops/unicom/
          if git diff --cached --quiet; then
            echo "本家数据无变化，跳过提交"
          else
            git commit -m "chore: 更新联通资费数据 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            # 4 家 workflow 同时 push 会撞车，rebase 重试（各家改不同目录，不会冲突）
            for i in 1 2 3 4 5 6; do
              if git push; then echo "数据已提交"; break; fi
              echo "push 冲突，rebase 后重试($i/6)"
              git pull --rebase origin main || git rebase --abort || true
              sleep 3
            done
          fi
