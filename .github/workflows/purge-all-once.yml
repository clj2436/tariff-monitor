name: purge-all-once

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 清 9 个源的 CDN 缓存
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          for op in gb-focus gb mobile-focus mobile telecom-focus telecom unicom-focus unicom-sichuan unicom; do
            python3 scripts/purge_cdn.py --op "$op"
          done
