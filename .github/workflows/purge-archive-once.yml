name: purge-archive-once

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 清 9 个源的存档缓存 + 检索页
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          SITE_URL: https://zf.chenlijun.eu.org
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          zone=os.environ['CF_ZONE_ID']; tok=os.environ['CF_API_TOKEN']; site=os.environ['SITE_URL']
          files=[site+'/archive.html']
          for op in 'gb-focus gb mobile-focus mobile telecom-focus telecom unicom-focus unicom-sichuan unicom'.split():
              files.append(site+'/data/ops/'+op+'/archive.bin')
          body=json.dumps({'files':files}).encode()
          req=urllib.request.Request('https://api.cloudflare.com/client/v4/zones/'+zone+'/purge_cache',
              data=body, method='DELETE', headers={'Authorization':'Bearer '+tok,
              'Content-Type':'application/json','Accept':'application/vnd.cloudflare.api.v4+json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              d=json.loads(r.read().decode())
          print('purge success:',d.get('success'),'| files:',len(files))
          assert d.get('success')
          PY
