name: 更新资费数据

# 每 8 小时自动抓取一次，每天 3 次，北京时间 00:00 / 08:00 / 16:00 整点，也可手动触发
on:
  schedule:
    - cron: '0 0,8,16 * * *'  # UTC 00:00 / 08:00 / 16:00 = 北京 08:00 / 16:00 / 次日 00:00
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

concurrency:
  group: tariff-update
  cancel-in-progress: false

# ── 架构：并行分片抓取 + 合并 ──
# 旧的串行单 job 要抓 4 家 × 31 省，联通一家就要 ~100 分钟，
# 总时长必然撞上 Actions 上限被强杀，导致数据一直不更新。
# 现在把每家运营商拆成独立 job 并行跑，联通再拆 2 片（每片 ~50 分钟），
# 各自输出 raw JSON artifact；merge job 汇总后统一 diff/提交/推送。
# 任一家失败不影响其他家：merge 时缺失板块自动保留上一轮旧数据。
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 100          # 单片上限；联通 16 省 ~50 分钟，留足余量
    strategy:
      fail-fast: false            # 一片失败不让其他片一起挂
      matrix:
        include:
          - carrier: mobile
            shard_idx: 0
            shard_total: 1
            label: 移动
          - carrier: telecom
            shard_idx: 0
            shard_total: 1
            label: 电信
          - carrier: gb
            shard_idx: 0
            shard_total: 1
            label: 广电
          - carrier: unicom
            shard_idx: 0
            shard_total: 2
            label: 联通·片0
          - carrier: unicom
            shard_idx: 1
            shard_total: 2
            label: 联通·片1
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取 ${{ matrix.carrier }} (片 ${{ matrix.shard_idx }}/${{ matrix.shard_total }})
        env:
          TRACK_PROVINCES: ${{ vars.TRACK_PROVINCES }}
          FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '3' }}
          UNICOM_TIME_BUDGET: ${{ vars.UNICOM_TIME_BUDGET || '120' }}
          GLOBAL_TIME_BUDGET_MIN: ${{ vars.GLOBAL_TIME_BUDGET_MIN || '90' }}
          SHARD_IDX: ${{ matrix.shard_idx }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        run: |
          mkdir -p raw
          python3 scripts/build_data.py \
            --carriers ${{ matrix.carrier }} \
            --raw-out raw/${{ matrix.carrier }}-${{ matrix.shard_idx }}.json
          python3 -c "import json,sys; n=len(json.load(open('raw/${{ matrix.carrier }}-${{ matrix.shard_idx }}.json'))); print('片内条目:',n); sys.exit(0 if n>0 else 1)"

      - name: 上传分片
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.carrier }}-${{ matrix.shard_idx }}
          path: raw/${{ matrix.carrier }}-${{ matrix.shard_idx }}.json
          retention-days: 1
          if-no-files-found: error

      # 边跑边同步：本片抓完立即发布 live 文件，网页按板块覆盖基底数据，
      # 用户几分钟内就能看到已完成的运营商，不用等最慢的联通。
      - name: 发布实时分片（网页渐进可见）
        run: |
          SHARD=${{ matrix.carrier }}-${{ matrix.shard_idx }}
          python3 scripts/publish_live.py --raw raw/$SHARD.json \
            --out data/live/$SHARD.json --op ${{ matrix.carrier }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/$SHARD.json data/live/$SHARD.meta.json
          if git diff --cached --quiet; then
            echo "实时分片无变化，跳过提交"
          else
            git commit -m "live: 发布 $SHARD [skip ci]"
            # 5 片并行 push 会互相撞车，rebase 重试
            for i in 1 2 3 4 5 6; do
              if git push; then echo "实时分片已发布：$SHARD"; break; fi
              echo "push 冲突，rebase 后重试($i/6)"
              git pull --rebase origin main || git rebase --abort || true
              sleep 3
            done
          fi

      # 分段 diff + 即时推送：diff 限定在本片成功抓到的板块内，下架判定仍是
      # 板块内闭环，不会把其他运营商/失败板块误判成下架。推送失败不阻断抓取，
      # emit 的清单作为 artifact 交给 merge 兜底时精确剔除。
      - name: 分段差异检测
        run: |
          SHARD=${{ matrix.carrier }}-${{ matrix.shard_idx }}
          mkdir -p changes
          python3 scripts/diff_shard.py --raw raw/$SHARD.json \
            --prev data/items.json --out changes/$SHARD.json

      - name: 即时推送本片变化
        id: shard_notify
        continue-on-error: true     # 推送失败不阻断数据，merge 会兜底补推
        env:
          WATCH_RULES: ${{ vars.WATCH_RULES || 'mobile:*;telecom:*' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_AT_MOBILES: ${{ vars.DINGTALK_AT_MOBILES }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          SHARD=${{ matrix.carrier }}-${{ matrix.shard_idx }}
          mkdir -p pushed
          python3 scripts/notify_dingtalk.py \
            --input changes/$SHARD.json \
            --state data/.notify_state_$SHARD.json \
            --emit-pushed pushed/$SHARD.json \
            --tag '${{ matrix.label }}' \
            > notify_$SHARD.log 2>&1 || { cat notify_$SHARD.log; exit 1; }
          cat notify_$SHARD.log

      - name: 上传本片推送清单
        uses: actions/upload-artifact@v4
        with:
          name: pushed-${{ matrix.carrier }}-${{ matrix.shard_idx }}
          path: pushed/${{ matrix.carrier }}-${{ matrix.shard_idx }}.json
          retention-days: 1
          if-no-files-found: ignore

  merge:
    needs: scrape
    if: always()   # 即使个别分片失败也合并：缺失运营商由板块级合并保留旧数据
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 关键：scrape 片期间已多次 push live 文件，默认检出（触发时的 commit）
      # 会落后，导致最后提交 non-fast-forward 被拒。scrape 全部完成后再检出
      # 最新 main，从源头消除落后；下方提交步骤仍保留 rebase 重试作兜底。
      - name: 检出仓库（最新 main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 下载所有分片
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true

      - name: 下载各片推送清单（供兜底去重）
        uses: actions/download-artifact@v4
        with:
          pattern: pushed-*
          path: pushed
          merge-multiple: true
        continue-on-error: true   # 全部推送失败时无清单，属预期

      - name: 合并 + 差异对比
        run: python3 scripts/build_data.py --merge-from raw --out data

      # 完整数据已生成，清掉实时分片：网页回到统一的 items.json，
      # 否则 live 会永久覆盖、下次抓取前 stale 数据一直显示。
      - name: 清理实时分片
        run: |
          rm -rf data/live
          echo "实时分片已清理，网页将切换到完整合并数据"

      - name: 检查数据完整性
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              meta = json.load(open('data/latest.json', encoding='utf-8'))
              items = json.load(open('data/items.json', encoding='utf-8'))
          except Exception as e:
              print('数据文件读取失败:', e); sys.exit(1)
          if meta.get('count', 0) < 10 or len(items) < 10:
              print('数据量异常，拒绝提交。count=%s items=%s' % (meta.get('count'), len(items)))
              sys.exit(1)
          print('数据校验通过：%d 条资费，%d 条变更；分布 %s' % (
              len(items), meta.get('changes', 0), meta.get('by_op')))
          PY

      # 兜底推送：各 scrape 片已即时推过本片变化，这里只补推「漏网的」——
      # 用分片 emit 的清单做 exclude，命中规则但未被任何分片推送的变化才会发。
      # 若某片抓取失败（无变化产出）或推送失败（无清单），其变化会在此补推。
      # Secrets: DINGTALK_WEBHOOK / DINGTALK_SECRET；Variables: WATCH_RULES 等。
      - name: 推送钉钉变动提醒（兜底补漏）
        continue-on-error: true
        env:
          WATCH_RULES: ${{ vars.WATCH_RULES || 'mobile:*;telecom:*' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          DINGTALK_AT_MOBILES: ${{ vars.DINGTALK_AT_MOBILES }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          EXCLUDE_ARGS=""
          for f in pushed/*.json; do
            [ -f "$f" ] && EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude $f"
          done
          echo "兜底剔除清单：$EXCLUDE_ARGS"
          python3 scripts/notify_dingtalk.py --input data/current_changes.json \
            --state data/.notify_state.json --tag '完整数据补推' $EXCLUDE_ARGS

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp telecom-tariff-monitor.html index.html
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 自动更新资费数据 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            # scrape 片期间已多次 push live 文件，本地可能落后，rebase 重试
            for i in 1 2 3 4 5 6; do
              if git push; then echo "数据已提交"; break; fi
              echo "push 冲突，rebase 后重试($i/6)"
              git pull --rebase origin main || git rebase --abort || true
              sleep 3
            done
          fi
