name: 抓取电信重点省份资费

# 重点专项：抓 新疆 / 吉林 / 江西 / 贵州 / 四川 / 山西 六省电信资费。
# 独立目录 / 独立预算 / 独立 diff / 独立钉钉推送 / 独立提交，不受全量电信 workflow 的护栏影响。
# 推送范围固定为这六省（重点源），全量电信 workflow 会排除这六省（其他源），两路不重复。
on:
  schedule:
    - cron: '35 0,4,8,12,16,20 * * *'   # 北京时间 00:35 起每 4 小时一次（00/04/08/12/16/20），与全量错峰 30 分钟
  workflow_dispatch:            # 手动触发

permissions:
  contents: write

concurrency:
  group: tariff-telecom-focus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 检出仓库（最新 main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 仅抓取电信重点省份并构建专项数据
        env:
          TELECOM_WORKERS: ${{ vars.TELECOM_WORKERS || '4' }}
          GLOBAL_TIME_BUDGET_MIN: ${{ vars.FOCUS_TIME_BUDGET_MIN || '45' }}
          BASELINE_PROVINCES: '新疆,吉林,江西,贵州,四川,山西'
        run: |
          python3 scripts/build_data.py \
            --carriers telecom \
            --sections xinjiang,jilin,jiangxi,guizhou,sichuan,shanxi \
            --out data/ops/telecom-focus \
            --baseline-if-empty --baseline-provinces '新疆,吉林,江西,贵州,四川,山西'

      - name: 校验专项数据
        run: |
          python3 - <<'PYCHECK'
          import json, sys
          out = 'data/ops/telecom-focus'
          try:
            meta = json.load(open(out + '/latest.json', encoding='utf-8'))
            items = json.load(open(out + '/items.json', encoding='utf-8'))
          except Exception as e:
            print('专项数据文件读取失败:', e); sys.exit(1)
          if not isinstance(items, list) or meta.get('count', -1) != len(items):
            print('数据不一致: meta.count=%s items=%s' % (meta.get('count'), len(items) if isinstance(items, list) else '?'))
            sys.exit(1)
          if not items:
            print('警告：本轮电信重点省份未抓到数据，已保留上一轮结果')
          else:
            by = meta.get('by_province') or {}
            missing = [p for p in ('新疆','吉林','江西','贵州','四川','山西') if not by.get(p)]
            print('电信重点专项校验通过：%d 条，本轮 %d 条变更；各省 %s%s' % (
              len(items), meta.get('changes', 0),
              ', '.join('%s:%s' % (p, by.get(p, 0)) for p in ('新疆','吉林','江西','贵州','四川','山西')),
              '（缺省：%s）' % ','.join(missing) if missing else ''))
          PYCHECK

      - name: 生成本轮变化报告页（供钉钉链接直达，随数据一起提交上线）
        continue-on-error: true   # 报告页生成失败不阻断数据抓取与推送
        run: |
          python3 scripts/build_report.py \
            --input data/ops/telecom-focus/current_changes.json \
            --out data/ops/telecom-focus/report.html \
            --tag '★重点·电信'
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          if [ -f data/ops/telecom-focus/report.html ]; then
            cp data/ops/telecom-focus/report.html "data/ops/telecom-focus/report-$STAMP.html"
            echo "REPORT_STAMP=$STAMP" >> "$GITHUB_ENV"
            echo "[报告] 已生成永久快照 report-$STAMP.html"
          fi

      - name: 生成下架资费加密存档（永久累积，需密码解密）
        continue-on-error: true   # 存档失败不阻断主数据抓取
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          python3 scripts/build_archive.py \
            --op telecom-focus \
            --items data/ops/telecom-focus/items.json \
            --changes data/ops/telecom-focus/current_changes.json \
            --out data/ops/telecom-focus/archive.bin
          # 密码未配置时脚本会跳过，不影响其余步骤

      - name: 提交专项数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ops/telecom-focus/
          if git diff --cached --quiet; then
            echo "专项数据无变化，跳过提交"
          else
            git commit -m "chore: 更新电信重点省份资费数据 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            for i in 1 2 3 4 5 6; do
              if git push; then echo "数据已提交"; break; fi
              echo "push 冲突，rebase 后重试($i/6)"
              git pull --rebase origin main || git rebase --abort || true
              sleep 3
            done
          fi

      - name: 清除该源 CDN 缓存
        continue-on-error: true     # 清缓存失败不阻断数据提交
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 scripts/purge_cdn.py --op telecom-focus

      - name: 推送重点变化到钉钉
        continue-on-error: true
        env:
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'dingtalk' }}
          WATCH_RULES: 'telecom:新疆|吉林|江西|贵州|四川|山西'
          DINGTALK_WEBHOOK_FOCUS: ${{ secrets.DINGTALK_WEBHOOK_FOCUS }}
          DINGTALK_SECRET_FOCUS: ${{ secrets.DINGTALK_SECRET_FOCUS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || '资费监控' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "${REPORT_STAMP:-}" ]; then
            REPORT_URL="${SITE_URL:-https://zf.chenlijun.eu.org}/data/ops/telecom-focus/report-${REPORT_STAMP}.html?v=2"
          else
            REPORT_URL="${SITE_URL:-https://zf.chenlijun.eu.org}/data/ops/telecom-focus/report.html?v=2"
          fi
          echo "[报告] 报告页地址：$REPORT_URL"
          python3 scripts/notify_dingtalk.py \
            --force-rules 'telecom:新疆|吉林|江西|贵州|四川|山西' \
            --input data/ops/telecom-focus/current_changes.json \
            --report-url "$REPORT_URL" \
            --state data/ops/telecom-focus/.notify_state.json \
            --bot focus \
            --tag '★重点·电信'
