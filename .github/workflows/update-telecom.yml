name: 抓取电信资费

# 独立 workflow：只抓 电信 一家，与其他运营商完全隔离。
# 抓取慢（如联通）只影响自己，不再拖慢其他家；无需全局 merge 等待。
on:
  schedule:
    - cron: '5 0,8,16 * * *'   # 北京时间 00:05 / 08:05 / 16:05
  workflow_dispatch:          # 手动触发

permissions:
  contents: write

# 每家独立并发组：同一家多次运行排队，不同家并行互不阻塞
concurrency:
  group: tariff-telecom
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: 检出仓库（最新 main）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 电信 并构建本家数据
        env:
          TRACK_PROVINCES: ${{ vars.TRACK_PROVINCES }}
          FETCH_WORKERS: ${{ vars.FETCH_WORKERS || '3' }}
          UNICOM_TIME_BUDGET: ${{ vars.UNICOM_TIME_BUDGET || '120' }}
          GLOBAL_TIME_BUDGET_MIN: ${{ vars.GLOBAL_TIME_BUDGET_MIN || '90' }}
        run: |
          python3 scripts/build_data.py --carriers telecom --out data/ops/telecom --baseline-if-empty

      - name: 校验本家数据
        run: |
          python3 - <<'PYCHECK'
          import json, sys
          op = 'telecom'
          try:
            meta = json.load(open('data/ops/%s/latest.json' % op, encoding='utf-8'))
            items = json.load(open('data/ops/%s/items.json' % op, encoding='utf-8'))
          except Exception as e:
            print('数据文件读取失败:', e); sys.exit(1)
          if not isinstance(items, list) or meta.get('count', -1) != len(items):
            print('数据不一致: meta.count=%s items=%s' % (meta.get('count'), len(items) if isinstance(items, list) else '?'))
            sys.exit(1)
          print('电信 校验通过：%d 条，本轮 %d 条变更，板块 %s' % (
            len(items), meta.get('changes', 0), ','.join(sorted((meta.get('by_province') or {}).keys()))))
          PYCHECK

      - name: 生成本轮变化报告页（供钉钉链接直达，随数据一起提交上线）
        continue-on-error: true   # 报告页生成失败不阻断数据抓取与推送
        run: |
          python3 scripts/build_report.py \
            --input data/ops/telecom/current_changes.json \
            --out data/ops/telecom/report.html \
            --tag '其他·电信'
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          if [ -f data/ops/telecom/report.html ]; then
            cp data/ops/telecom/report.html "data/ops/telecom/report-$STAMP.html"
            echo "REPORT_STAMP=$STAMP" >> "$GITHUB_ENV"
            echo "[报告] 已生成永久快照 report-$STAMP.html"
          fi

      - name: 生成下架资费加密存档（永久累积，需密码解密）
        continue-on-error: true   # 存档失败不阻断主数据抓取
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          python3 scripts/build_archive.py \
            --op telecom \
            --items data/ops/telecom/items.json \
            --changes data/ops/telecom/current_changes.json \
            --out data/ops/telecom/archive.bin
          # 密码未配置时脚本会跳过，不影响其余步骤

      - name: 提交本家数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ops/telecom/
          if git diff --cached --quiet; then
            echo "本家数据无变化，跳过提交"
          else
            git commit -m "chore: 更新电信资费数据 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            # 4 家 workflow 同时 push 会撞车，rebase 重试（各家改不同目录，不会冲突）
            for i in 1 2 3 4 5 6; do
              if git push; then echo "数据已提交"; break; fi
              echo "push 冲突，rebase 后重试($i/6)"
              git pull --rebase origin main || git rebase --abort || true
              sleep 3
            done
          fi

      - name: 清除该源 CDN 缓存
        continue-on-error: true     # 清缓存失败不阻断数据提交
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 scripts/purge_cdn.py --op telecom

      - name: 推送本家变化到钉钉
        continue-on-error: true     # 推送失败不阻断数据提交
        env:
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'dingtalk' }}
          WATCH_RULES: ${{ vars.WATCH_RULES || 'telecom:*' }}
          DINGTALK_WEBHOOK_OTHER: ${{ secrets.DINGTALK_WEBHOOK_OTHER }}
          DINGTALK_SECRET_OTHER: ${{ secrets.DINGTALK_SECRET_OTHER }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || '资费监控' }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "${REPORT_STAMP:-}" ]; then
            REPORT_URL="${SITE_URL:-https://zf.chenlijun.eu.org}/data/ops/telecom/report-${REPORT_STAMP}.html?v=2"
          else
            REPORT_URL="${SITE_URL:-https://zf.chenlijun.eu.org}/data/ops/telecom/report.html?v=2"
          fi
          echo "[报告] 报告页地址：$REPORT_URL"
          python3 scripts/notify_dingtalk.py \
            --force-rules 'telecom:*' \
            --exclude-rules 'telecom:新疆|吉林|江西|贵州|四川|山西' \
            --input data/ops/telecom/current_changes.json \
            --report-url "$REPORT_URL" \
            --state data/ops/telecom/.notify_state.json \
            --bot other \
            --tag '其他·电信'
