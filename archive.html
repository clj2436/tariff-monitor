<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资费永久档案 · 加密检索</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --card2:#fafbfc; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --border2:#f0f1f4; --shadow:0 2px 10px rgba(16,24,40,.05);
  --blue:#2563eb; --blue-soft:#eff6ff; --up:#e11d2a; --down:#0f9d6e; --warn:#b45309;
  --mobile:#0f9d6e; --unicom:#e11d2a; --telecom:#2f6fdb; --gb:#7c3aed;
}
body.dark{
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --text:#e5e7eb; --muted:#94a3b8;
  --border:#334155; --border2:#2a3648; --shadow:0 2px 12px rgba(0,0,0,.25);
  --blue:#60a5fa; --blue-soft:#1e3a5f; --warn:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto;padding:22px 26px 44px}
button,select,input{font-family:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#4338ca,#0f9d6e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;box-shadow:0 4px 12px rgba(67,56,202,.25);flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700}
.brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
/* 锁屏 */
.lock-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh}
.lock{width:100%;max-width:420px;padding:34px 30px;text-align:center}
.lock .ico{width:64px;height:64px;border-radius:18px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
.lock h2{margin:0 0 8px;font-size:20px}
.lock p{margin:0 0 22px;color:var(--muted);font-size:13px}
.lock input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text);font-size:14px;outline:none}
.lock input:focus{border-color:var(--blue)}
.lock .btn{width:100%;margin-top:12px;padding:11px}
.lock .err{color:var(--up);font-size:12.5px;margin-top:12px;min-height:18px}
.lock .hint{color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.7}

.hero{background:linear-gradient(120deg,#4338ca,#0f9d6e);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{margin:0;font-size:19px;font-weight:750}
.hero p{margin:6px 0 0;font-size:12.5px;opacity:.88}
.hero-stats{display:flex;gap:34px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-stats b{display:block;font-size:22px;font-weight:750;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.84}

.loadbar{padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.loadbar .track{height:6px;border-radius:4px;background:var(--border2);overflow:hidden;margin-top:8px}
.loadbar .fill{height:100%;background:var(--blue);width:0;transition:width .3s}

.filters{padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:120px}
.fld label{font-size:11.5px;color:var(--muted);font-weight:600}
.fld input,.fld select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:13px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.fld.grow{flex:1;min-width:200px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card2);color:var(--muted);padding:8px 13px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}

.result-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.result-head .n{font-size:13px;font-weight:700}
.result-head .n small{color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border2);font-size:12.5px;vertical-align:top}
th{background:var(--card2);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;white-space:nowrap}
tr.row:hover{background:var(--blue-soft);cursor:pointer}
.op-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}
.op-mobile{background:var(--mobile)}.op-unicom{background:var(--unicom)}.op-telecom{background:var(--telecom)}.op-gb{background:var(--gb)}
.st-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.st-off{background:#fee2e2;color:#b91c1c}
body.dark .st-off{background:#4c1d1d;color:#fca5a5}
.st-on{background:#dcfce7;color:#15803d}
body.dark .st-on{background:#14532d;color:#86efac}
.name-cell b{font-weight:650}
.name-cell .meta{color:var(--muted);font-size:11px;margin-top:2px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;opacity:.35;margin-bottom:8px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.mask.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.modal-head h3{margin:0;font-size:16px}
.modal-head .sub{color:var(--muted);font-size:12px;margin-top:4px}
.modal-body{padding:18px 20px;overflow:auto}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 20px;margin-bottom:22px}
.dt{border-bottom:1px solid var(--border2);padding:6px 0}
.dt .lb{color:var(--muted);font-size:11px}
.dt .vl{font-size:13px;word-break:break-all}
.sec-t{font-size:13px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item::before{content:"";position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--card)}
.tl-item.k-下架::before{background:var(--up)}
.tl-item.k-新增::before{background:var(--down)}
.tl-item .d{font-size:11.5px;color:var(--muted)}
.tl-item .k{font-weight:700;font-size:12.5px;margin-top:1px}
.tl-item .f{font-size:12px;color:var(--muted);margin-top:4px;background:var(--card2);padding:7px 10px;border-radius:7px}
.tl-item .f div{margin:2px 0}
.oldv{color:var(--up)}
.note-box{background:var(--card2);border:1px solid var(--border2);border-radius:9px;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="appLock">
  <div class="lock-wrap">
    <div class="card lock">
      <div class="ico">&#128274;</div>
      <h2>资费永久档案</h2>
      <p>本档案为加密存储，请输入访问密码解锁</p>
      <input type="password" id="pwd" placeholder="访问密码" autocomplete="off">
      <button class="btn primary" id="unlockBtn">解锁档案</button>
      <div class="err" id="lockErr"></div>
      <div class="hint">档案数据在你的浏览器本地解密，密码不会上传到任何服务器。<br>忘记密码将无法恢复档案内容。</div>
    </div>
  </div>
</div>

<div class="app" id="appMain" style="display:none">
  <div class="topbar">
    <div class="brand">
      <div class="logo">&#128218;</div>
      <div><h1>资费永久档案</h1><div class="sub">已下架资费副本与完整变化记录 · 加密检索</div></div>
    </div>
    <div class="tools">
      <button class="btn" id="themeBtn">切换主题</button>
      <button class="btn" id="lockBtn">锁定</button>
    </div>
  </div>

  <div class="hero">
    <h2>所有出现过的资费，永久留存</h2>
    <p>数据逐轮累积、只增不删；已下架资费保留下架时的完整快照与全部变化记录。</p>
    <div class="hero-stats">
      <div><b id="sTotal">—</b><span>档案总数</span></div>
      <div><b id="sOffline">—</b><span>已下架</span></div>
      <div><b id="sHistory">—</b><span>变化记录</span></div>
      <div><b id="sUpdated">—</b><span>最后更新</span></div>
    </div>
  </div>

  <div class="card loadbar" id="loadbar">
    <span id="loadText">准备加载加密档案…</span>
    <div class="track"><div class="fill" id="loadFill"></div></div>
  </div>

  <div class="card filters">
    <div class="fld"><label>状态</label>
      <div class="seg" id="segStatus">
        <button data-v="offline" class="on">已下架</button>
        <button data-v="all">全部</button>
        <button data-v="online">在售</button>
      </div>
    </div>
    <div class="fld"><label>运营商</label><select id="fOp"><option value="">全部</option><option value="mobile">移动</option><option value="unicom">联通</option><option value="telecom">电信</option><option value="gb">广电</option></select></div>
    <div class="fld"><label>省份</label><select id="fProv"><option value="">全部</option></select></div>
    <div class="fld grow"><label>搜索（名称 / 编号 / 归属 / 说明）</label><input id="fKw" placeholder="输入关键词实时检索…"></div>
    <button class="btn" id="csvBtn">导出 CSV</button>
  </div>

  <div class="card">
    <div class="result-head">
      <div class="n" id="resultN">—</div>
      <span class="muted" style="font-size:11.5px">点击任意行查看完整快照与变化记录</span>
    </div>
    <div style="overflow:auto;max-height:70vh">
      <table>
        <thead><tr><th>运营商</th><th>资费名称</th><th>省份</th><th>价格</th><th>状态</th><th>首次出现</th><th>下架日期</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none"><div class="big">&#128193;</div><div>没有符合条件的档案记录</div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="mTitle">资费详情</h3><div class="sub" id="mSub"></div></div>
      <button class="btn" id="mClose">关闭</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
const OPS=[
  {id:'mobile',name:'移动'},{id:'telecom',name:'电信'},{id:'unicom',name:'联通'},{id:'gb',name:'广电'},
  {id:'mobile-focus',name:'移动·重点'},{id:'telecom-focus',name:'电信·重点'},
  {id:'unicom-focus',name:'联通·重点'},{id:'gb-focus',name:'广电·重点'},
  {id:'unicom-sichuan',name:'联通·四川专项'}
];
const MAGIC='ARC1';
const LABEL={
  name:'资费名称',code:'资费编号',type:'类型',owner:'归属方',province:'省份',price:'价格',
  data:'流量',voice:'语音',broadband:'宽带',scope:'适用范围',region:'适用地区',channel:'销售渠道',
  onDate:'上架日期',offDate:'下架日期',validPeriod:'有效期',inNetReq:'在网要求',unsubscribe:'退订方式',
  date:'采集日期',source:'来源',note:'说明',id:'档案编号'
};
let vaults={}, records=[], password='', state={status:'offline',op:'',prov:'',kw:''};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- 主题
(function(){try{if(localStorage.getItem('ar_theme')==='dark'||(!localStorage.getItem('ar_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark')}catch(e){}})();
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('ar_theme',document.body.classList.contains('dark')?'dark':'light')}catch(e){}};

// ---- Web Crypto 解密（与 Python archive_store 格式一致）
async function decryptBlob(buf,pwd){
  const dv=new DataView(buf);
  if(String.fromCharCode(...new Uint8Array(buf,0,4))!==MAGIC) throw new Error('格式错误');
  const salt=new Uint8Array(buf,4,16), iv=new Uint8Array(buf,20,12), tag=new Uint8Array(buf,32,16), ct=new Uint8Array(buf,48);
  const kMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},kMat,{name:'AES-GCM',length:256},false,['decrypt']);
  const combined=new Uint8Array(ct.length+tag.length);combined.set(ct);combined.set(tag,ct.length);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,combined);
  return JSON.parse(new TextDecoder().decode(plain));
}

async function loadAll(){
  const bar=$('#loadbar');bar.style.display='';
  let done=0;const results=[];
  await Promise.all(OPS.map(async op=>{
    let r={op,ok:false,data:null,msg:''};
    try{
      const resp=await fetch('data/ops/'+op.id+'/archive.bin?v=2');
      if(resp.status===404){r.msg='暂无存档'}
      else if(!resp.ok){r.msg='HTTP '+resp.status}
      else{
        r.data=await decryptBlob(await resp.arrayBuffer(),password);r.ok=true;
      }
    }catch(e){r.msg=(e&&e.name==='OperationError')?'密码错误':'加载失败'}
    results.push(r);done++;
    $('#loadFill').style.width=Math.round(done/OPS.length*100)+'%';
    $('#loadText').textContent='解密中… '+done+' / '+OPS.length+'（'+op.name+'）';
  }));
  const bad=results.filter(r=>!r.ok&&r.msg&&r.msg!=='暂无存档');
  if(!results.some(r=>r.ok)&&bad.length){
    $('#loadErr');throw new Error(bad[0].msg);
  }
  vaults={};records=[];let total=0,offline=0,history=0,updated='';
  const idx=new Map();  // 用 Map 索引去重，避免 records.find 的 O(n²) 线性扫描（6万条时差 700 倍）
  results.forEach(r=>{
    if(!r.ok||!r.data||!r.data.records)return;
    vaults[r.op.id]=r.data;
    Object.entries(r.data.records).forEach(([k,rec])=>{
      // 专项源与全量源重复时，保留更完整的（变化记录更多的）
      const merged=mkRecord(rec,r.op.id);
      const pos=idx.get(k);
      if(pos===undefined){idx.set(k,records.length);records.push(merged);}
      else if((merged.h||[]).length>(records[pos].h||[]).length){records[pos]=merged;}
    });
  });
  records.forEach(rec=>{total++;if(rec.st==='已下架')offline++;history+=(rec.h||[]).length});
  Object.values(vaults).forEach(v=>{if(v.updated&&v.updated>updated)updated=v.updated});
  $('#sTotal').textContent=total.toLocaleString();
  $('#sOffline').textContent=offline.toLocaleString();
  $('#sHistory').textContent=history.toLocaleString();
  $('#sUpdated').textContent=updated?updated.slice(0,10):'—';
  bar.style.display='none';
  // 若还没有任何下架记录（刚建立基线），默认切到「全部」，避免用户看到空列表
  if(offline===0&&total>0){
    state.status='all';
    $('#segStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='all'));
    const tip=document.createElement('div');
    tip.style.cssText='padding:9px 14px;margin-bottom:12px;font-size:12.5px;color:var(--warn);background:var(--card2);border:1px solid var(--border);border-radius:8px';
    tip.textContent='提示：档案刚建立基线，暂无已下架资费。已收录 '+total.toLocaleString()+' 条在售资费作为起点，此后每次下架都会永久留存并计入「已下架」。';
    $('#loadbar').after(tip);
  }
  buildProvinces();render();
}

function mkRecord(rec,src){
  const baseSrc=(rec.op||src).split('-')[0];
  return {
    __key:rec.k, name:rec.n||'(未命名)', op:baseSrc, prov:rec.p||'全国',
    price:(rec.i&&rec.i.price)||'', owner:(rec.i&&rec.i.owner)||'',
    code:(rec.i&&rec.i.code)||'', note:(rec.i&&rec.i.note)||(rec.i&&rec.i.note_full)||'',
    st:rec.st||'在售', fs:rec.fs||'', ls:rec.ls||'', os:rec.os||'',
    i:rec.i||{}, h:rec.h||[], src:src
  };
}

function buildProvinces(){
  const set=new Set(records.map(r=>r.prov).filter(p=>p&&p!=='全国'));
  const sel=$('#fProv');const cur=sel.value;
  sel.innerHTML='<option value="">全部</option>'+[...set].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
  sel.value=cur;
}

function filtered(){
  const kw=state.kw.trim().toLowerCase();
  return records.filter(r=>{
    if(state.status==='offline'&&r.st!=='已下架')return false;
    if(state.status==='online'&&r.st==='已下架')return false;
    if(state.op&&r.op!==state.op)return false;
    if(state.prov&&r.prov!==state.prov)return false;
    if(kw){
      const hay=(r.name+' '+r.code+' '+r.owner+' '+r.price+' '+r.note+' '+JSON.stringify(r.i)).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  }).sort((a,b)=>(b.os||b.ls||'').localeCompare(a.os||a.ls||''));
}

function render(){
  const list=filtered();
  $('#resultN').innerHTML='共 <b>'+list.length.toLocaleString()+'</b> 条 <small>（档案总计 '+records.length.toLocaleString()+' 条）</small>';
  const tb=$('#tbody');
  tb.innerHTML=list.slice(0,500).map((r,i)=>
    '<tr class="row" data-i="'+i+'">'+
    '<td><span class="op-tag op-'+esc(r.op)+'">'+({mobile:'移动',unicom:'联通',telecom:'电信',gb:'广电'}[r.op]||r.op)+'</span></td>'+
    '<td class="name-cell"><b>'+esc(r.name)+'</b>'+(r.code?'<div class="meta">编号 '+esc(r.code)+'</div>':'')+'</td>'+
    '<td>'+esc(r.prov)+'</td><td class="mono">'+esc(r.price||'—')+'</td>'+
    '<td><span class="st-tag '+(r.st==='已下架'?'st-off':'st-on')+'">'+esc(r.st)+'</span></td>'+
    '<td class="muted mono">'+esc(r.fs||'—')+'</td><td class="muted mono">'+esc(r.os||'—')+'</td></tr>'
  ).join('');
  $('#empty').style.display=list.length?'none':'block';
  if(list.length>500){
    tb.insertAdjacentHTML('beforeend','<tr><td colspan="7" class="muted" style="text-align:center">仅显示前 500 条，请用检索或导出 CSV 查看全部（共 '+list.length+' 条）</td></tr>');
  }
  tb.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>showDetail(list[+tr.dataset.i]));
}

function showDetail(r){
  $('#mTitle').textContent=r.name;
  $('#mSub').textContent=({mobile:'移动',unicom:'联通',telecom:'电信',gb:'广电'}[r.op]||r.op)+' · '+r.prov+' · '+r.st+(r.os?' · 下架于 '+r.os:'');
  const it=r.i;
  let grid='<div class="sec-t">资费快照（'+(r.st==='已下架'?'下架时':'最后一次采集')+'）</div><div class="detail-grid">';
  [['资费名称',r.name],['资费编号',r.code],['省份',r.prov],['价格',it.price],['流量',it.data],['语音',it.voice],
   ['宽带',it.broadband],['归属方',it.owner],['类型',it.type],['适用范围',it.scope],['采集日期',it.date],
   ['首次出现',r.fs],['最后出现',r.ls],['下架日期',r.os]].forEach(([l,v])=>{
    if(v)grid+='<div class="dt"><div class="lb">'+esc(l)+'</div><div class="vl">'+esc(v)+'</div></div>';
  });
  grid+='</div>';
  if(it.details&&Object.keys(it.details).length){
    grid+='<div class="sec-t">公示详情</div><div class="detail-grid">';
    Object.entries(it.details).forEach(([k,v])=>{
      grid+='<div class="dt"><div class="lb">'+esc(LABEL[k]||k)+'</div><div class="vl">'+esc(v)+'</div></div>';
    });
    grid+='</div>';
  }
  if(r.note)grid+='<div class="sec-t">说明</div><div class="note-box">'+esc(r.note)+'</div>';
  grid+='<div class="sec-t" style="margin-top:22px">变化记录（共 '+r.h.length+' 条）</div>';
  if(!r.h.length)grid+='<div class="muted" style="font-size:12.5px">暂无变化记录</div>';
  else{
    grid+='<div class="tl">';
    r.h.slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).forEach(e=>{
      grid+='<div class="tl-item k-'+esc(e.k)+'"><div class="d">'+esc(e.d||'')+'</div><div class="k">'+esc(e.k)+'</div>';
      if(e.f&&Object.keys(e.f).length){
        grid+='<div class="f">'+Object.entries(e.f).map(([k,v])=>'<div>'+esc(LABEL[k]||k)+'：<span class="oldv">'+esc(v==null?'空':v)+'</span></div>').join('')+'</div>';
      }
      grid+='</div>';
    });
    grid+='</div>';
  }
  $('#mBody').innerHTML=grid;
  $('#mask').classList.add('show');
}
$('#mClose').onclick=()=>$('#mask').classList.remove('show');
$('#mask').onclick=e=>{if(e.target===$('#mask'))$('#mask').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#mask').classList.remove('show')});

// ---- 筛选事件
$('#segStatus').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#segStatus').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');state.status=b.dataset.v;render();
});
$('#fOp').onchange=e=>{state.op=e.target.value;render()};
$('#fProv').onchange=e=>{state.prov=e.target.value;render()};
let kwTimer;$('#fKw').oninput=e=>{clearTimeout(kwTimer);kwTimer=setTimeout(()=>{state.kw=e.target.value;render()},120)};

$('#csvBtn').onclick=()=>{
  const list=filtered();
  const head=['运营商','省份','资费名称','编号','价格','状态','首次出现','最后出现','下架日期','变化记录数'];
  const rows=list.map(r=>[({mobile:'移动',unicom:'联通',telecom:'电信',gb:'广电'}[r.op]||r.op),r.prov,r.name,r.code,r.price,r.st,r.fs,r.ls,r.os,r.h.length]);
  const csv='\ufeff'+[head].concat(rows).map(a=>a.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='资费永久档案_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};

// ---- 解锁/锁定
async function doUnlock(){
  const pwd=$('#pwd').value;
  if(!pwd){$('#lockErr').textContent='请输入密码';return}
  $('#lockErr').textContent='';$('#unlockBtn').disabled=true;$('#unlockBtn').textContent='解密中…';
  password=pwd;
  try{
    await loadAll();
    $('#appLock').style.display='none';$('#appMain').style.display='';
    try{sessionStorage.setItem('ar_pwd',pwd)}catch(e){}
  }catch(e){
    $('#lockErr').textContent=(e&&e.message==='密码错误')?'密码错误，请重试':('解密失败：'+(e&&e.message||e));
  }finally{$('#unlockBtn').disabled=false;$('#unlockBtn').textContent='解锁档案'}
}
$('#unlockBtn').onclick=doUnlock;
$('#pwd').onkeydown=e=>{if(e.key==='Enter')doUnlock()};
$('#lockBtn').onclick=()=>{password='';records=[];vaults={};try{sessionStorage.removeItem('ar_pwd')}catch(e){}$('#appMain').style.display='none';$('#appLock').style.display='';$('#pwd').value='';$('#pwd').focus()};
(function(){try{const p=sessionStorage.getItem('ar_pwd');if(p){$('#pwd').value=p;doUnlock()}}catch(e){}})();
</script>
