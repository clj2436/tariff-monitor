<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资费永久档案 · 加密检索</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --card2:#fafbfc; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --border2:#f0f1f4; --shadow:0 2px 10px rgba(16,24,40,.05);
  --blue:#2563eb; --blue-soft:#eff6ff; --up:#e11d2a; --down:#0f9d6e; --warn:#b45309;
  --mobile:#0f9d6e; --unicom:#e11d2a; --telecom:#2f6fdb; --gb:#7c3aed;
}
body.dark{
  --bg:#0f172a; --card:#1e293b; --card2:#172033; --text:#e5e7eb; --muted:#94a3b8;
  --border:#334155; --border2:#2a3648; --shadow:0 2px 12px rgba(0,0,0,.25);
  --blue:#60a5fa; --blue-soft:#1e3a5f; --warn:#fbbf24;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:22px 26px 44px}
button,select,input{font-family:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#4338ca,#0f9d6e);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;box-shadow:0 4px 12px rgba(67,56,202,.25);flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700}
.brand .sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:600;padding:3px 6px}
.link-btn:hover{text-decoration:underline}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
/* 锁屏 */
.lock-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh}
.lock{width:100%;max-width:420px;padding:34px 30px;text-align:center}
.lock .ico{width:64px;height:64px;border-radius:18px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px}
.lock h2{margin:0 0 8px;font-size:20px}
.lock p{margin:0 0 22px;color:var(--muted);font-size:13px}
.lock input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text);font-size:14px;outline:none}
.lock input:focus{border-color:var(--blue)}
.lock .btn{width:100%;margin-top:12px;padding:11px}
.lock .err{color:var(--up);font-size:12.5px;margin-top:12px;min-height:18px}
.lock .hint{color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.7}

.hero{background:linear-gradient(120deg,#4338ca,#0f9d6e);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero h2{margin:0;font-size:19px;font-weight:750}
.hero p{margin:6px 0 0;font-size:12.5px;opacity:.88}
.hero-stats{display:flex;gap:34px;margin-top:16px;flex-wrap:wrap;position:relative}
.hero-stats b{display:block;font-size:22px;font-weight:750;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.84}

.loadbar{padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted)}
.loadbar .track{height:6px;border-radius:4px;background:var(--border2);overflow:hidden;margin-top:8px}
.loadbar .fill{height:100%;background:var(--blue);width:0;transition:width .3s}

/* 筛选栏（对齐主站） */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);margin-bottom:14px}
.filters select,.filters input[type=text],.filters input[type=number]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card2);color:var(--text);font-size:12.5px;outline:none}
.filters select:focus,.filters input:focus{border-color:var(--blue)}
.price-range{display:inline-flex;align-items:center;gap:5px}
.price-range input{width:88px}
.price-unit{color:var(--muted);font-size:12px}
.search input{width:230px}
.filter-info{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card2);color:var(--muted);padding:8px 13px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--blue);color:#fff}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;color:var(--muted);font-weight:600}

.result-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.result-head .n{font-size:13px;font-weight:700}
.result-head .n small{color:var(--muted);font-weight:400}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border2);font-size:12.5px;vertical-align:top}
th{background:var(--card2);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1;white-space:nowrap}
tr.row:hover{background:var(--blue-soft);cursor:pointer}
.op-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}
.op-mobile{background:var(--mobile)}.op-unicom{background:var(--unicom)}.op-telecom{background:var(--telecom)}.op-gb{background:var(--gb)}
.st-tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.st-off{background:#fee2e2;color:#b91c1c}
body.dark .st-off{background:#4c1d1d;color:#fca5a5}
.st-on{background:#dcfce7;color:#15803d}
body.dark .st-on{background:#14532d;color:#86efac}
.name-cell b{font-weight:650}
.name-cell .meta{color:var(--muted);font-size:11px;margin-top:2px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;opacity:.35;margin-bottom:8px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.mask.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:18px 22px;overflow:auto}
.close{border:0;background:none;color:var(--muted);font-size:23px;line-height:1;padding:0 4px}
.close:hover{color:var(--text)}
/* 公示专区详情（对齐主站） */
.pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--blue-soft);color:var(--blue);display:inline-block}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px;font-size:11px;color:var(--muted)}
.op-badge{display:inline-flex;align-items:center;gap:5px;background:var(--card2);color:var(--oc);padding:3px 8px;border-radius:5px;font-size:11.5px;font-weight:700;white-space:nowrap}
.op-badge i{width:6px;height:6px;border-radius:50%;background:var(--oc)}
.pub-group-title{font-size:12.5px;font-weight:700;color:var(--text);padding:14px 2px 7px;display:flex;align-items:center;gap:7px}
.pub-group-title::before{content:"";width:3px;height:13px;background:var(--blue);border-radius:2px}
.pub-table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:9px;overflow:hidden;font-size:12.5px;margin-bottom:4px}
.pub-table td{border:1px solid var(--border);padding:9px 13px;vertical-align:top}
.pub-table td.k{width:130px;background:var(--card2);color:var(--muted);font-weight:600;white-space:nowrap}
.pub-list{margin:0;padding:0;list-style:none}
.pub-list li{position:relative;padding:7px 0 7px 15px;line-height:1.75;border-bottom:1px dashed var(--border);word-break:break-word}
.pub-list li:last-child{border-bottom:0}
.pub-list li::before{content:"";position:absolute;left:2px;top:15px;width:4px;height:4px;border-radius:50%;background:var(--blue)}
.pub-list li b{color:var(--blue);font-weight:700}
.pub-list .lead{font-weight:700;color:var(--blue)}
/* 变化记录时间线 */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item::before{content:"";position:absolute;left:-18px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--card)}
.tl-item.k-下架::before{background:var(--up)}
.tl-item.k-新增::before{background:var(--down)}
.tl-item .d{font-size:11.5px;color:var(--muted)}
.tl-item .k{font-weight:700;font-size:12.5px;margin-top:1px}
.diff-table{margin-top:6px}
.diff-table th{background:var(--card2);color:var(--muted);font-weight:600;font-size:11.5px;padding:7px 10px;border:1px solid var(--border);position:static}
.diff-before{color:var(--up);word-break:break-word}
.diff-after{color:var(--down);word-break:break-word}
.detail-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:16px}
</style>
</head>
<body>
<div class="app" id="appLock">
  <div class="lock-wrap">
    <div class="card lock">
      <div class="ico">&#128274;</div>
      <h2>资费永久档案</h2>
      <p>本档案为加密存储，请输入访问密码解锁</p>
      <input type="password" id="pwd" placeholder="访问密码" autocomplete="off">
      <button class="btn primary" id="unlockBtn">解锁档案</button>
      <div class="err" id="lockErr"></div>
      <div class="hint">档案数据在你的浏览器本地解密，密码不会上传到任何服务器。<br>忘记密码将无法恢复档案内容。</div>
    </div>
  </div>
</div>

<div class="app" id="appMain" style="display:none">
  <div class="topbar">
    <div class="brand">
      <div class="logo">&#128218;</div>
      <div><h1>资费永久档案</h1><div class="sub">已下架资费副本与完整变化记录 · 加密检索</div></div>
    </div>
    <div class="tools">
      <a class="btn" href="index.html">返回主站</a>
      <button class="btn" id="themeBtn">切换主题</button>
      <button class="btn" id="lockBtn">锁定</button>
    </div>
  </div>

  <div class="hero">
    <h2>所有出现过的资费，永久留存</h2>
    <p>数据逐轮累积、只增不删；已下架资费保留下架时的完整快照与全部变化记录。</p>
    <div class="hero-stats">
      <div><b id="sTotal">—</b><span>档案总数</span></div>
      <div><b id="sOffline">—</b><span>已下架</span></div>
      <div><b id="sHistory">—</b><span>变化记录</span></div>
      <div><b id="sUpdated">—</b><span>最后更新</span></div>
    </div>
  </div>

  <div class="card loadbar" id="loadbar">
    <span id="loadText">准备加载加密档案…</span>
    <div class="track"><div class="fill" id="loadFill"></div></div>
  </div>

  <div class="filters">
    <div class="fld"><label>状态</label>
      <div class="seg" id="segStatus">
        <button data-v="offline" class="on">已下架</button>
        <button data-v="all">全部</button>
        <button data-v="online">在售</button>
      </div>
    </div>
    <select id="fOp"><option value="">全部运营商</option><option value="mobile">移动</option><option value="unicom">联通</option><option value="telecom">电信</option><option value="gb">广电</option></select>
    <select id="fProv"><option value="">全部省份</option></select>
    <select id="fType"><option value="">全部类型</option><option>套餐</option><option>加装包</option><option>营销活动</option></select>
    <select id="fOwner"><option value="">全部归属</option><option>个人</option><option>政企</option></select>
    <select id="fSort"><option value="off">按下架时间</option><option value="price">按月费</option><option value="fs">按首次出现</option><option value="name">按名称</option></select>
    <div class="price-range" title="按月费区间筛选（元/月，可只填一端）"><input type="number" id="fPmin" min="0" step="any" placeholder="最低月费"><span>—</span><input type="number" id="fPmax" min="0" step="any" placeholder="最高月费"><span class="price-unit">元</span></div>
    <button class="btn" id="fZero" title="只看 0 元业务">零元业务</button>
    <button class="btn" id="fReset">重置</button>
    <div class="search"><input type="text" id="fKw" placeholder="搜索名称/编号/归属/说明/详情" style="width:230px"></div>
    <div class="filter-info"><span id="fCount">共 0 条</span><button class="link-btn" id="csvBtn">导出 CSV</button></div>
  </div>

  <div class="card">
    <div class="result-head">
      <div class="n" id="resultN">—</div>
      <span class="muted" style="font-size:11.5px">点击任意行查看完整公示详情与变化记录（与主站一致）</span>
    </div>
    <div style="overflow:auto;max-height:70vh">
      <table>
        <thead><tr><th>运营商</th><th>业务名称</th><th>类型</th><th>归属</th><th>月费</th><th>流量/语音</th><th>省份</th><th>状态</th><th>下架日期</th><th>详情</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none"><div class="big">&#128193;</div><div>没有符合条件的档案记录</div></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head">
      <div><h3 id="mTitle">资费详情</h3><div class="detail-meta" id="mMeta"></div></div>
      <button class="close" id="mClose">&times;</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
const OPS=[
  {id:'mobile',name:'移动'},{id:'telecom',name:'电信'},{id:'unicom',name:'联通'},{id:'gb',name:'广电'},
  {id:'mobile-focus',name:'移动·重点'},{id:'telecom-focus',name:'电信·重点'},
  {id:'unicom-focus',name:'联通·重点'},{id:'gb-focus',name:'广电·重点'},
  {id:'unicom-sichuan',name:'联通·四川专项'}
];
const CARRIERS={mobile:{name:'中国移动',short:'移动',color:'#0f9d6e'},unicom:{name:'中国联通',short:'联通',color:'#e11d2a'},telecom:{name:'中国电信',short:'电信',color:'#2f6fdb'},gb:{name:'中国广电',short:'广电',color:'#7c3aed'}};
const CHG_LABELS={price:'月费',data:'通用流量',voice:'语音',broadband:'宽带',note:'资费说明',note_full:'完整说明',scope:'适用范围',region:'通用地区',channel:'销售渠道',onDate:'上线日期',offDate:'下线日期',validPeriod:'有效期限',inNetReq:'在网要求',unsubscribe:'退订方式',responsibility:'违约责任',sms:'短信',orient:'定向流量',regionData:'省内流量',iptv:'移动高清',rights:'权益',service:'其他服务内容',extraFees:'超出资费说明',otherNotes:'其他说明'};
const KNOWN_DETAILS=new Set(['scope','region','channel','onDate','offDate','validPeriod','inNetReq','unsubscribe','responsibility','sms','orient','regionData','iptv','rights','service','extraFees','otherNotes']);
let vaults={}, records=[], password='', state={status:'offline',op:'',prov:'',type:'',owner:'',sort:'off',pmin:'',pmax:'',zero:false,kw:''};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>(Number(v)||0).toFixed(2).replace(/\.00$/,'');
const opName=op=>(CARRIERS[op]||{}).name||op;

// ---- 主题
(function(){try{if(localStorage.getItem('ar_theme')==='dark'||(!localStorage.getItem('ar_theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.body.classList.add('dark')}catch(e){}})();
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('ar_theme',document.body.classList.contains('dark')?'dark':'light')}catch(e){}};

// ---- Web Crypto 解密（兼容 ARC1 明文 / ARC2 gzip）
async function gunzip(buf){
  if(!('DecompressionStream' in window)) throw new Error('浏览器不支持解压，请用新版 Chrome/Edge/Safari');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return await new Response(stream).arrayBuffer();
}
async function decryptBlob(buf,pwd){
  const magic=String.fromCharCode(...new Uint8Array(buf,0,4));
  const gz=(magic==='ARC2');
  if(!gz&&magic!=='ARC1') throw new Error('格式错误');
  const salt=new Uint8Array(buf,4,16), iv=new Uint8Array(buf,20,12), tag=new Uint8Array(buf,32,16), ct=new Uint8Array(buf,48);
  const kMat=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},kMat,{name:'AES-GCM',length:256},false,['decrypt']);
  const combined=new Uint8Array(ct.length+tag.length);combined.set(ct);combined.set(tag,ct.length);
  let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,combined);
  if(gz) plain=await gunzip(plain);
  return JSON.parse(new TextDecoder().decode(plain));
}

async function loadAll(){
  const bar=$('#loadbar');bar.style.display='';
  let done=0;const results=[];
  await Promise.all(OPS.map(async op=>{
    let r={op,ok:false,data:null,msg:''};
    try{
      const resp=await fetch('data/ops/'+op.id+'/archive.bin?v=3');
      if(resp.status===404){r.msg='暂无存档'}
      else if(!resp.ok){r.msg='HTTP '+resp.status}
      else{ r.data=await decryptBlob(await resp.arrayBuffer(),password);r.ok=true; }
    }catch(e){r.msg=(e&&e.name==='OperationError')?'密码错误':(e&&e.message||'加载失败')}
    results.push(r);done++;
    $('#loadFill').style.width=Math.round(done/OPS.length*100)+'%';
    $('#loadText').textContent='解密中… '+done+' / '+OPS.length+'（'+op.name+'）';
  }));
  const bad=results.filter(r=>!r.ok&&r.msg&&r.msg!=='暂无存档');
  if(!results.some(r=>r.ok)&&bad.length) throw new Error(bad[0].msg);
  vaults={};records=[];let total=0,offline=0,history=0,updated='';
  const idx=new Map();
  results.forEach(r=>{
    if(!r.ok||!r.data||!r.data.records)return;
    vaults[r.op.id]=r.data;
    Object.entries(r.data.records).forEach(([k,rec])=>{
      const merged=mkRecord(rec,r.op.id);
      const pos=idx.get(k);
      if(pos===undefined){idx.set(k,records.length);records.push(merged);}
      else if((merged.h||[]).length>(records[pos].h||[]).length){records[pos]=merged;}
    });
  });
  records.forEach(rec=>{total++;if(rec.st==='已下架')offline++;history+=(rec.h||[]).length});
  Object.values(vaults).forEach(v=>{if(v.updated&&v.updated>updated)updated=v.updated});
  $('#sTotal').textContent=total.toLocaleString();
  $('#sOffline').textContent=offline.toLocaleString();
  $('#sHistory').textContent=history.toLocaleString();
  $('#sUpdated').textContent=updated?updated.slice(0,10):'—';
  bar.style.display='none';
  if(offline===0&&total>0){
    state.status='all';
    $('#segStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='all'));
    const tip=document.createElement('div');
    tip.style.cssText='padding:9px 14px;margin-bottom:12px;font-size:12.5px;color:var(--warn);background:var(--card2);border:1px solid var(--border);border-radius:8px';
    tip.textContent='提示：档案刚建立基线，暂无已下架资费。已收录 '+total.toLocaleString()+' 条在售资费作为起点，此后每次下架都会永久留存并计入「已下架」。';
    $('#loadbar').after(tip);
  }
  buildProvinces();render();
}

function mkRecord(rec,src){
  const baseSrc=(rec.op||src).split('-')[0];
  const i=rec.i||{};
  return {
    __key:rec.k, name:rec.n||'(未命名)', op:baseSrc, prov:i.province||rec.p||'全国',
    price:i.price||'', type:i.type||'', owner:i.owner||'', code:i.code||'',
    data:i.data||'', voice:i.voice||'', broadband:i.broadband||'', source:i.source||'',
    st:rec.st||'在售', fs:rec.fs||'', ls:rec.ls||'', os:rec.os||'',
    i:i, h:rec.h||[], src:src
  };
}

function buildProvinces(){
  const set=new Set(records.map(r=>r.prov).filter(p=>p&&p!=='全国'));
  const sel=$('#fProv');const cur=sel.value;
  sel.innerHTML='<option value="">全部省份</option>'+[...set].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');
  sel.value=cur;
}

function filtered(){
  const kw=state.kw.trim().toLowerCase();
  const pmin=state.pmin!==''?Number(state.pmin):null, pmax=state.pmax!==''?Number(state.pmax):null;
  let list=records.filter(r=>{
    if(state.status==='offline'&&r.st!=='已下架')return false;
    if(state.status==='online'&&r.st==='已下架')return false;
    if(state.op&&r.op!==state.op)return false;
    if(state.prov&&r.prov!==state.prov)return false;
    if(state.type&&r.type!==state.type)return false;
    if(state.owner&&r.owner!==state.owner)return false;
    if(state.zero&&Number(r.price)!==0)return false;
    if(pmin!==null&&Number.isFinite(pmin)&&Number(r.price)<pmin)return false;
    if(pmax!==null&&Number.isFinite(pmax)&&Number(r.price)>pmax)return false;
    if(kw){
      const hay=(r.name+' '+r.code+' '+r.owner+' '+r.price+' '+r.type+' '+JSON.stringify(r.i)).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  });
  const sortKey=state.sort;
  list.sort((a,b)=>{
    if(sortKey==='price')return (Number(a.price)||0)-(Number(b.price)||0);
    if(sortKey==='fs')return (b.fs||'').localeCompare(a.fs||'');
    if(sortKey==='name')return (a.name||'').localeCompare(b.name||'','zh');
    return (b.os||b.ls||'').localeCompare(a.os||a.ls||''); // off：下架/最近时间
  });
  return list;
}

function render(){
  const list=filtered();
  $('#fCount').textContent='共 '+list.length.toLocaleString()+' 条';
  $('#resultN').innerHTML='共 <b>'+list.length.toLocaleString()+'</b> 条 <small>（档案总计 '+records.length.toLocaleString()+' 条）</small>';
  const tb=$('#tbody');
  tb.innerHTML=list.slice(0,500).map((r,i)=>
    '<tr class="row" data-i="'+i+'">'+
    '<td><span class="op-tag op-'+esc(r.op)+'">'+esc((CARRIERS[r.op]||{}).short||r.op)+'</span></td>'+
    '<td class="name-cell"><b>'+esc(r.name)+'</b>'+(r.code?'<div class="meta">编号 '+esc(r.code)+'</div>':'')+'</td>'+
    '<td>'+esc(r.type||'—')+'</td><td>'+esc(r.owner||'—')+'</td>'+
    '<td class="mono">'+(r.price!==''?money(r.price)+' 元':'—')+'</td>'+
    '<td>'+esc([r.data,r.voice].filter(Boolean).join(' / ')||'—')+'</td>'+
    '<td>'+esc(r.prov)+'</td>'+
    '<td><span class="st-tag '+(r.st==='已下架'?'st-off':'st-on')+'">'+esc(r.st)+'</span></td>'+
    '<td class="muted mono">'+esc(r.os||'—')+'</td>'+
    '<td><button class="detail" data-detail="'+i+'">查看</button></td></tr>'
  ).join('');
  $('#empty').style.display=list.length?'none':'block';
  if(list.length>500) tb.insertAdjacentHTML('beforeend','<tr><td colspan="10" class="muted" style="text-align:center">仅显示前 500 条，请用检索或导出 CSV 查看全部（共 '+list.length+' 条）</td></tr>');
  tb.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>showDetail(list[+tr.dataset.i]));
  tb.querySelectorAll('[data-detail]').forEach(b=>b.onclick=e=>{e.stopPropagation();showDetail(list[+b.dataset.detail])});
}

// ---- 详情：对齐主站 renderPublicDetail（基础/内容/规则/补充/其他服务 + 变化逐字段对比）
function splitNote(note){
  if(!note)return [];
  let parts=note.split(/(?=[（(][一二三四五六七八九十]{1,3}[）)])|(?=(?:^|[；;\s])\d+[\.、．])/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1)parts=note.split(/(?<=[；;])/).map(s=>s.trim()).filter(Boolean);
  return parts.length?parts:[note];
}
function decoratePara(p){
  const m=p.match(/^([（(]?[一二三四五六七八九十\d]+[）)]?\s*[^：:]{0,14}[：:])(.*)$/s);
  return m?'<span class="lead">'+esc(m[1])+'</span>'+esc(m[2]):esc(p);
}
function detVal(det,key){
  const aliases={scope:['scope','useScope','适用范围'],region:['region','applicableArea','适用地区','通用地区'],channel:['channel','saleChnl','销售渠道'],onDate:['onDate','上线日期'],offDate:['offDate','下线日期'],validPeriod:['validPeriod','有效期限','有效期'],inNetReq:['inNetReq','在网要求'],unsubscribe:['unsubscribe','退订方式'],responsibility:['responsibility','违约责任'],sms:['sms','短信'],orient:['orient','orientTraffic','定向流量'],regionData:['regionData','省内流量'],iptv:['iptv','移动高清'],rights:['rights','权益'],service:['service','serviceContent','其他服务内容'],extraFees:['extraFees','超出资费说明'],otherNotes:['otherNotes','其他说明']};
  for(const a of (aliases[key]||[key])) if(det&&det[a])return det[a];
  return '';
}
function diffVal(v,k){if(v==null||v==='')return '—';const s=String(v).replace(/\s+/g,' ').trim();return k==='price'?money(Number(v)||0):(s.length>200?s.slice(0,200)+'…':s);}
function changeLabel(k){const base=String(k).replace(/^details\./,'');return CHG_LABELS[base]||CHG_LABELS[k]||'补充信息';}
function changeFieldVal(r,k){return k.indexOf('details.')===0?(r.i.details||{})[k.slice(8)]:(r.i[k]!==undefined?r.i[k]:r[k]);}

function showDetail(r){
  $('#mTitle').textContent=r.name;
  const c=CARRIERS[r.op]||{color:'#6b7280',name:r.op};
  $('#mMeta').innerHTML='<span class="op-badge" style="--oc:'+c.color+'"><i></i>'+esc(c.name)+'</span>'+
    '<span class="pill">'+esc(r.prov)+'</span><span class="pill">'+esc(r.st)+'</span>'+
    (r.os?'<span class="pill">下架于 '+esc(r.os)+'</span>':'')+
    (r.code?'<span class="pill">编号 '+esc(r.code)+'</span>':'')+
    '<span class="pill">来源 '+esc(r.source||'—')+'</span>';
  const det=r.i.details||{};
  // 资费内容
  const resRows=[['国内通话',r.voice||r.i.voice],['国内通用流量',r.data||r.i.data],['定向流量',detVal(det,'orient')],['短信',detVal(det,'sms')]];
  if((r.broadband||r.i.broadband)&&(r.broadband||r.i.broadband)!=='—')resRows.push(['宽带',r.broadband||r.i.broadband]);
  if(detVal(det,'iptv'))resRows.push(['移动高清',detVal(det,'iptv')]);
  const resTable='<table class="pub-table">'+resRows.map(([k,v])=>'<tr><td class="k">'+k+'</td><td>'+esc(v||'—')+'</td></tr>').join('')+'</table>';
  // 业务规则
  const rules=[['适用范围',detVal(det,'scope')],['通用地区',detVal(det,'region')||(r.prov==='全国'?'全网':r.prov)],['销售渠道',detVal(det,'channel')],['上线日期',detVal(det,'onDate')],['下线日期',detVal(det,'offDate')],['有效期限',detVal(det,'validPeriod')],['在网要求',detVal(det,'inNetReq')],['退订方式',detVal(det,'unsubscribe')],['违约责任',detVal(det,'responsibility')]];
  const ruleList='<ul class="pub-list">'+rules.map(([k,v])=>'<li><b>'+k+'：</b>'+esc(v||'无')+'</li>').join('')+'</ul>';
  // 其他服务内容
  const service=detVal(det,'service')||r.i.note_full||r.i.note||'';
  const svcList=service?'<ul class="pub-list">'+splitNote(service).map(p=>'<li>'+decoratePara(p)+'</li>').join('')+'</ul>':'<div class="muted">暂无其他服务内容说明。</div>';
  // 补充信息兜底：未识别的 details 字段按「补充信息 N」展示，不裸露英文键
  const left=Object.keys(det).filter(k=>!KNOWN_DETAILS.has(k)&&!CHG_LABELS[k]);
  const otherList=left.length?'<ul class="pub-list">'+left.map((k,i)=>'<li><b>补充信息 '+(i+1)+'：</b>'+esc(String(det[k]))+'</li>').join('')+'</ul>':'';
  const extraBits=[['权益',detVal(det,'rights')],['超出资费说明',detVal(det,'extraFees')],['其他说明',detVal(det,'otherNotes')]].filter(x=>x[1]);
  const extraList=(extraBits.length||otherList)?'<ul class="pub-list">'+extraBits.map(([k,v])=>'<li><b>'+k+'：</b>'+esc(v)+'</li>').join('')+otherList.replace(/^<ul class="pub-list">|<\/ul>$/g,'')+'</ul>':'';
  let html='<div class="pub-group-title">基础信息</div>'+
    '<table class="pub-table">'+
      '<tr><td class="k">资费名称</td><td>'+esc(r.name)+'</td></tr>'+
      '<tr><td class="k">方案编号</td><td>'+esc(r.code||'—')+'</td></tr>'+
      '<tr><td class="k">资费类型</td><td>'+esc(r.type||'—')+'</td></tr>'+
      '<tr><td class="k">归属</td><td>'+esc(r.owner||'—')+'</td></tr>'+
      '<tr><td class="k">资费标准</td><td>'+(r.price!==''?money(r.price):'—')+' 元/月</td></tr>'+
      '<tr><td class="k">省份</td><td>'+esc(r.prov)+'</td></tr>'+
      '<tr><td class="k">首次出现</td><td>'+esc(r.fs||'—')+'</td></tr>'+
      '<tr><td class="k">最后出现</td><td>'+esc(r.ls||'—')+'</td></tr>'+
      (r.os?'<tr><td class="k">下架日期</td><td>'+esc(r.os)+'</td></tr>':'')+
    '</table>'+
    '<div class="pub-group-title">资费内容</div>'+resTable+
    '<div class="pub-group-title">业务规则</div>'+ruleList+
    (extraList?'<div class="pub-group-title">补充信息</div>'+extraList:'')+
    '<div class="pub-group-title">其他服务内容</div>'+svcList+
    '<div class="muted" style="padding:10px 2px;font-size:11px">数据来源：'+esc(r.source||'')+' · 采集日期 '+esc(r.i.date||'')+'</div>';
  // 变化记录（逐字段前后对比）
  html+='<div class="pub-group-title">变化记录（共 '+r.h.length+' 条）</div>';
  if(!r.h.length) html+='<div class="muted" style="font-size:12.5px">暂无变化记录</div>';
  else{
    html+='<div class="tl">';
    r.h.slice().sort((a,b)=>(b.d||'').localeCompare(a.d||'')).forEach(e=>{
      html+='<div class="tl-item k-'+esc(e.k)+'"><div class="d">'+esc(e.d||'')+'</div><div class="k">'+esc(e.k)+'</div>';
      if(e.f&&Object.keys(e.f).length){
        html+='<table class="pub-table diff-table"><thead><tr><th>变更字段</th><th>变更前</th><th>变更后</th></tr></thead><tbody>'+
          Object.keys(e.f).map(k=>'<tr><td class="k">'+esc(changeLabel(k))+'</td><td class="diff-before">'+esc(diffVal(e.f[k],k))+'</td><td class="diff-after">'+esc(diffVal(changeFieldVal(r,k),k))+'</td></tr>').join('')+
          '</tbody></table>';
      }
      html+='</div>';
    });
    html+='</div>';
  }
  $('#mBody').innerHTML=html;
  $('#mask').classList.add('show');
}
$('#mClose').onclick=()=>$('#mask').classList.remove('show');
$('#mask').onclick=e=>{if(e.target===$('#mask'))$('#mask').classList.remove('show')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#mask').classList.remove('show')});

// ---- 筛选事件
function refresh(){render()}
$('#segStatus').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#segStatus').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');state.status=b.dataset.v;refresh();
});
['fOp','fProv','fType','fOwner','fSort'].forEach(id=>$('#'+id).onchange=e=>{
  const key={fOp:'op',fProv:'prov',fType:'type',fOwner:'owner',fSort:'sort'}[id];
  state[key]=e.target.value;refresh();
});
$('#fPmin').oninput=e=>{state.pmin=e.target.value;refresh()};
$('#fPmax').oninput=e=>{state.pmax=e.target.value;refresh()};
$('#fZero').onclick=()=>{state.zero=!state.zero;$('#fZero').classList.toggle('on',state.zero);refresh()};
let kwTimer;$('#fKw').oninput=e=>{clearTimeout(kwTimer);kwTimer=setTimeout(()=>{state.kw=e.target.value;refresh()},120)};
$('#fReset').onclick=()=>{
  Object.assign(state,{status:'offline',op:'',prov:'',type:'',owner:'',sort:'off',pmin:'',pmax:'',zero:false,kw:''});
  ['fOp','fProv','fType','fOwner'].forEach(id=>$('#'+id).value='');
  $('#fSort').value='off';$('#fPmin').value='';$('#fPmax').value='';$('#fKw').value='';
  $('#fZero').classList.remove('on');
  $('#segStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v==='offline'));
  render();
};
$('#csvBtn').onclick=()=>{
  const list=filtered();
  const head=['运营商','省份','业务名称','类型','归属','编号','月费','流量','语音','状态','首次出现','最后出现','下架日期','变化记录数','来源'];
  const rows=list.map(r=>[opName(r.op),r.prov,r.name,r.type,r.owner,r.code,r.price,r.data,r.voice,r.st,r.fs,r.ls,r.os,r.h.length,r.source]);
  const csv='\ufeff'+[head].concat(rows).map(a=>a.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='资费永久档案_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};

// ---- 解锁/锁定
async function doUnlock(){
  const pwd=$('#pwd').value;
  if(!pwd){$('#lockErr').textContent='请输入密码';return}
  $('#lockErr').textContent='';$('#unlockBtn').disabled=true;$('#unlockBtn').textContent='解密中…';
  password=pwd;
  try{
    await loadAll();
    $('#appLock').style.display='none';$('#appMain').style.display='';
    try{sessionStorage.setItem('ar_pwd',pwd)}catch(e){}
  }catch(e){
    $('#lockErr').textContent=(e&&e.message==='密码错误')?'密码错误，请重试':('解密失败：'+(e&&e.message||e));
  }finally{$('#unlockBtn').disabled=false;$('#unlockBtn').textContent='解锁档案'}
}
$('#unlockBtn').onclick=doUnlock;
$('#pwd').onkeydown=e=>{if(e.key==='Enter')doUnlock()};
$('#lockBtn').onclick=()=>{password='';records=[];vaults={};try{sessionStorage.removeItem('ar_pwd')}catch(e){}$('#appMain').style.display='none';$('#appLock').style.display='';$('#pwd').value='';$('#pwd').focus()};
(function(){try{const p=sessionStorage.getItem('ar_pwd');if(p){$('#pwd').value=p;doUnlock()}}catch(e){}})();
</script>
